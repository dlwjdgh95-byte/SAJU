<title>운의 시간표</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --paper:#E7E9E4; --sheet:#F6F7F3; --sunk:#DFE2DC;
    --ink:#171B1F; --ink-dim:#5C646B; --ink-faint:#8B939A;
    --rule:#C6CBC4; --rule-soft:#D8DCD5;
    --seal:#9C3B2E;
    --mok:#3C7A54; --hwa:#B4433A; --to:#9A6E2C; --geum:#63707B; --su:#2F5B7C;
    --wang:#2C6B4F; --swe:#8B5A6B;
    --serif:"Noto Serif KR",'Apple SD Gothic Neo',"Nanum Myeongjo",serif;
    --sans:"IBM Plex Sans KR",'Apple SD Gothic Neo',"Malgun Gothic",system-ui,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --maxw:1120px;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --paper:#12151A; --sheet:#1A1E24; --sunk:#0D1014;
      --ink:#E6E9E4; --ink-dim:#98A0A7; --ink-faint:#6C757D;
      --rule:#2D343B; --rule-soft:#232930;
      --seal:#D46A57;
      --mok:#5FA97C; --hwa:#DB7166; --to:#C79A4E; --geum:#9AA6B0; --su:#5E93BB;
      --wang:#5FA97C; --swe:#C08AA0;
    }
  }
  :root[data-theme="dark"]{
    --paper:#12151A; --sheet:#1A1E24; --sunk:#0D1014;
    --ink:#E6E9E4; --ink-dim:#98A0A7; --ink-faint:#6C757D;
    --rule:#2D343B; --rule-soft:#232930;
    --seal:#D46A57;
    --mok:#5FA97C; --hwa:#DB7166; --to:#C79A4E; --geum:#9AA6B0; --su:#5E93BB;
    --wang:#5FA97C; --swe:#C08AA0;
  }

  *{box-sizing:border-box}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:var(--sans); font-size:15px; line-height:1.72;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:var(--maxw); margin:0 auto; padding:0 20px 72px}
  h1,h2,h3{margin:0; font-family:var(--serif); font-weight:600; text-wrap:balance}
  p{margin:0 0 .85em}
  p:last-child{margin-bottom:0}
  .mono{font-family:var(--mono); font-variant-numeric:tabular-nums}
  .eyebrow{
    font-family:var(--mono); font-size:11px; letter-spacing:.14em;
    text-transform:uppercase; color:var(--ink-faint);
  }
  :focus-visible{outline:2px solid var(--seal); outline-offset:2px}

  /* ── 마스트헤드 ─────────────────────────────── */
  .masthead{
    border-bottom:1.5px solid var(--ink);
    padding:26px 0 14px; margin-bottom:0;
    display:flex; flex-wrap:wrap; align-items:flex-end; gap:18px 28px;
  }
  .brand{display:flex; align-items:baseline; gap:10px}
  .brand h1{font-size:27px; letter-spacing:-.01em; line-height:1.1}
  .brand .stamp{
    font-family:var(--serif); font-size:12px; color:var(--seal);
    border:1px solid var(--seal); border-radius:2px;
    padding:1px 4px 2px; line-height:1; letter-spacing:.08em;
  }
  .masthead .today{margin-left:auto; text-align:right; line-height:1.5}
  .masthead .today .d{font-family:var(--mono); font-size:12.5px; color:var(--ink-dim)}
  .masthead .today .gz{font-family:var(--serif); font-size:18px; font-weight:600}
  .masthead .today .gz em{font-style:normal; color:var(--ink-dim); font-size:13px; font-family:var(--sans)}

  .subline{
    display:flex; flex-wrap:wrap; gap:6px 20px; align-items:baseline;
    padding:9px 0; border-bottom:1px solid var(--rule);
    font-size:12.5px; color:var(--ink-dim);
  }
  .subline .k{font-family:var(--sans); font-weight:500; font-size:11px; letter-spacing:.05em; color:var(--ink-faint)}

  /* ── 오늘 ───────────────────────────────────── */
  .daily{
    border-bottom:1px solid var(--rule); padding:20px 0 22px;
    display:grid; grid-template-columns:132px minmax(0,1fr); gap:0 28px; align-items:start;
  }
  .daily .stampcol{border-right:1px solid var(--rule-soft); padding-right:20px}
  .daily .ilju{
    font-family:var(--serif); font-size:38px; font-weight:700; line-height:1.05;
  }
  .daily .ilju small{display:block; font-family:var(--sans); font-size:11px; font-weight:400; color:var(--ink-faint); letter-spacing:.04em; margin-top:2px}
  .daily .meta{margin-top:9px; font-size:11.5px; color:var(--ink-dim); line-height:1.65}
  .daily .meta b{color:var(--ink); font-weight:500}
  .daily h2{font-size:19px; line-height:1.35; margin-bottom:7px}
  .daily p{font-size:14.5px; line-height:1.78}
  .daily .act{
    margin-top:12px; padding-top:11px; border-top:1px dotted var(--rule-soft);
    font-size:13.5px; color:var(--ink-dim);
  }
  .daily .act b{color:var(--seal); font-weight:500}
  .daily .stale{
    margin-top:10px; font-size:11.5px; color:var(--ink-faint);
    border-left:2px solid var(--rule); padding-left:9px; line-height:1.6;
  }
  @media (max-width:640px){
    .daily{grid-template-columns:1fr; gap:16px}
    .daily .stampcol{border-right:none; border-bottom:1px solid var(--rule-soft); padding:0 0 14px}
  }

  /* ── 명식 그리드 ────────────────────────────── */
  .board{
    display:grid; grid-template-columns:76px repeat(5,1fr);
    border-bottom:1px solid var(--rule);
  }
  .board .rowlabel{
    font-family:var(--mono); font-size:10.5px; letter-spacing:.08em;
    color:var(--ink-faint); text-transform:uppercase;
    display:flex; align-items:center; padding:0 10px 0 0;
    border-right:1px solid var(--rule-soft);
  }
  .col{
    border-right:1px solid var(--rule-soft); padding:0 6px;
    display:flex; flex-direction:column; align-items:center; text-align:center;
  }
  .col:last-child{border-right:none}
  .col.unse{background:var(--sunk); border-left:1.5px solid var(--seal)}
  .cap{
    padding:9px 0 7px; width:100%; font-size:11.5px; color:var(--ink-dim);
    border-bottom:1px solid var(--rule-soft); font-family:var(--mono);
    letter-spacing:.06em;
  }
  .col.unse .cap{color:var(--seal); font-weight:500}
  .cap{font-family:var(--sans); letter-spacing:.03em}
  .glyph{
    font-family:var(--serif); font-weight:700; line-height:1.05;
    font-size:clamp(30px,6.5vw,46px); padding:12px 0 2px;
  }
  .glyph .ko{display:block; font-family:var(--sans); font-size:11px; font-weight:400; color:var(--ink-faint); letter-spacing:.05em}
  .slot{
    width:100%; padding:5px 2px; font-size:11.5px; line-height:1.45;
    border-top:1px dotted var(--rule-soft); color:var(--ink-dim);
  }
  .slot b{display:block; font-weight:500; color:var(--ink); font-size:12px}
  .slot .alt{font-size:10.5px; color:var(--ink-faint)}
  .m木{color:var(--mok)} .m火{color:var(--hwa)} .m土{color:var(--to)}
  .m金{color:var(--geum)} .m水{color:var(--su)}

  /* ── 기간 눈금 ──────────────────────────────── */
  .scale{
    display:grid; grid-template-columns:repeat(6,1fr);
    border-bottom:1.5px solid var(--ink); margin-bottom:26px;
  }
  .scale button{
    appearance:none; background:none; border:none; cursor:pointer;
    border-right:1px solid var(--rule-soft); border-bottom:3px solid transparent;
    padding:11px 6px 9px; text-align:left; color:var(--ink-dim);
    font-family:var(--sans); font-size:13px; line-height:1.35;
    transition:background .14s, color .14s;
  }
  .scale button:last-child{border-right:none}
  .scale button .t{display:block; font-family:var(--mono); font-size:10px; letter-spacing:.12em; color:var(--ink-faint)}
  .scale button .n{font-weight:500; color:var(--ink)}
  .scale button:hover{background:var(--sheet)}
  .scale button[aria-selected="true"]{border-bottom-color:var(--seal); background:var(--sheet)}
  .scale button[aria-selected="true"] .n{color:var(--seal)}

  /* ── 판독 ───────────────────────────────────── */
  .reading{display:grid; grid-template-columns:minmax(0,340px) minmax(0,1fr); gap:0 40px}
  .ledger{border-right:1px solid var(--rule); padding-right:26px}
  .ldr-row{
    display:grid; grid-template-columns:62px 1fr; gap:10px;
    padding:9px 0; border-bottom:1px dotted var(--rule-soft);
    font-size:13px; align-items:baseline;
  }
  .ldr-row:last-child{border-bottom:none}
  .ldr-row dt{
    font-family:var(--sans); font-weight:500; font-size:11px; letter-spacing:.06em;
    color:var(--ink-faint); padding-top:3px;
  }
  .ldr-row dd{margin:0}
  .ldr-row dd .sub{display:block; color:var(--ink-dim); font-size:12px; line-height:1.5}
  dl{margin:0}

  .tag{
    display:inline-block; font-size:11.5px; line-height:1.5;
    padding:1px 7px 2px; margin:0 4px 4px 0;
    border:1px solid var(--rule); border-radius:2px; color:var(--ink-dim);
    font-family:var(--mono);
  }
  .tag.hit{border-color:var(--seal); color:var(--seal)}
  .tag.wang{border-color:var(--wang); color:var(--wang)}
  .tag.swe{border-color:var(--swe); color:var(--swe)}

  .prose h2{
    font-size:23px; line-height:1.3; margin-bottom:4px; letter-spacing:-.01em;
  }
  .prose .lede{
    font-family:var(--serif); font-size:15.5px; color:var(--ink-dim);
    margin-bottom:20px; padding-bottom:16px; border-bottom:1px solid var(--rule-soft);
  }
  .prose h3{
    font-size:11.5px; font-family:var(--sans); font-weight:500; letter-spacing:.09em;
    color:var(--ink-faint);
    margin:24px 0 8px; padding-bottom:5px; border-bottom:1px solid var(--rule-soft);
  }
  .prose h3:first-of-type{margin-top:0}
  .verdict{
    display:grid; grid-template-columns:1fr 1fr; gap:0;
    border:1px solid var(--rule); margin-top:24px;
  }
  .verdict div{padding:13px 16px}
  .verdict div+div{border-left:1px solid var(--rule)}
  .verdict .lab{
    font-family:var(--sans); font-weight:500; font-size:11px; letter-spacing:.07em;
    color:var(--ink-faint); display:block; margin-bottom:4px;
  }
  .verdict .do .lab{color:var(--seal)}
  .verdict strong{font-weight:500; font-size:14px; line-height:1.5}

  /* 관계 목록 */
  .rels{list-style:none; margin:0; padding:0}
  .rels li{
    display:grid; grid-template-columns:78px 1fr; gap:12px;
    padding:7px 0; border-bottom:1px dotted var(--rule-soft); font-size:13.5px;
  }
  .rels li:last-child{border-bottom:none}
  .rels .who{font-family:var(--sans); font-size:11.5px; color:var(--ink-faint); padding-top:3px}
  .rels .what b{font-weight:500}
  .rels .what span{color:var(--ink-dim)}

  /* 주간 스트립 */
  .week{margin-top:30px; border-top:1px solid var(--rule); padding-top:0}
  .weekhead{
    font-size:11.5px; font-family:var(--sans); font-weight:500; letter-spacing:.09em;
    color:var(--ink-faint); padding:12px 0 10px;
  }
  .weekhead span{font-weight:400; letter-spacing:0}
  .week .days{display:grid; grid-template-columns:repeat(7,1fr); border-bottom:1px solid var(--rule)}
  .week .day{
    border-right:1px solid var(--rule-soft); padding:10px 6px 12px; text-align:center;
    display:flex; flex-direction:column; gap:3px; min-height:112px;
  }
  .week .day:last-child{border-right:none}
  .week .day.today{background:var(--sheet)}
  .week .day.marked{background:var(--sunk)}
  .week .day .dow{font-family:var(--mono); font-size:10px; letter-spacing:.08em; color:var(--ink-faint)}
  .week .day .dt{font-family:var(--mono); font-size:12px; color:var(--ink-dim)}
  .week .day .gz{font-family:var(--serif); font-size:21px; font-weight:600; line-height:1.15}
  .week .day .mk{font-size:11px; line-height:1.35; color:var(--seal)}
  .week .day .s12{font-size:10.5px; color:var(--ink-faint)}
  .week .day.today .dt{color:var(--seal); font-weight:500}

  /* ── 하단 명식 상세 ─────────────────────────── */
  .foot{margin-top:44px; border-top:1.5px solid var(--ink); padding-top:0}
  .panels{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:0}
  .panel{border-right:1px solid var(--rule); padding:18px 24px 20px}
  .panel:first-child{padding-left:0}
  .panel:last-child{border-right:none; padding-right:0}
  .panel h3{
    font-family:var(--sans); font-size:11.5px; font-weight:500; letter-spacing:.09em;
    color:var(--ink-faint); margin-bottom:12px;
  }
  .bars{display:flex; flex-direction:column; gap:7px}
  .bar{display:grid; grid-template-columns:36px 1fr 22px; gap:8px; align-items:center; font-size:12.5px}
  .bar .nm{font-family:var(--serif); font-weight:600}
  .bar .tr{height:7px; background:var(--sunk); position:relative; overflow:hidden}
  .bar .fl{position:absolute; inset:0 auto 0 0; height:100%}
  .bar .ct{font-family:var(--mono); font-size:11.5px; color:var(--ink-dim); text-align:right}
  .b木{background:var(--mok)} .b火{background:var(--hwa)} .b土{background:var(--to)}
  .b金{background:var(--geum)} .b水{background:var(--su)}

  .daewoon{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(58px,1fr));
    border:1px solid var(--rule-soft); border-width:1px 0 0 1px;
  }
  .dw{padding:8px 5px; text-align:center; border:1px solid var(--rule-soft); border-width:0 1px 1px 0}
  .dw.on{background:var(--sunk); box-shadow:inset 0 -3px 0 var(--seal)}
  .dw .a{font-family:var(--mono); font-size:10.5px; color:var(--ink-faint)}
  .dw .g{font-family:var(--serif); font-size:18px; font-weight:600; line-height:1.2}

  .kv{display:grid; grid-template-columns:auto 1fr; gap:4px 12px; font-size:12.5px}
  .kv dt{font-family:var(--sans); font-weight:500; font-size:11px; letter-spacing:.04em; color:var(--ink-faint); padding-top:3px}
  .kv dd{margin:0; color:var(--ink-dim)}
  .kv dd b{color:var(--ink); font-weight:500}

  /* ── 설정 ───────────────────────────────────── */
  .settings{margin-top:36px; border-top:1px solid var(--rule); padding-top:16px}
  .settings summary{
    cursor:pointer; font-family:var(--sans); font-weight:500; font-size:12.5px;
    letter-spacing:.03em; color:var(--ink-dim); list-style:none;
  }
  .settings summary::-webkit-details-marker{display:none}
  .settings summary::before{content:"⌖ "; color:var(--seal)}
  .settings summary:hover{color:var(--ink)}
  .form{
    display:flex; flex-wrap:wrap; gap:14px 20px; align-items:flex-end;
    margin-top:16px; padding:18px 20px; background:var(--sheet); border:1px solid var(--rule-soft);
  }
  .field{display:flex; flex-direction:column; gap:4px}
  .field label{font-family:var(--sans); font-weight:500; font-size:11px; letter-spacing:.05em; color:var(--ink-faint)}
  .field input,.field select{
    font-family:var(--mono); font-size:13.5px; padding:6px 9px;
    border:1px solid var(--rule); background:var(--paper); color:var(--ink);
    border-radius:2px; min-width:0;
  }
  .form button{
    font-family:var(--sans); font-size:13.5px; font-weight:500; cursor:pointer;
    padding:7px 18px; border:1px solid var(--seal); background:var(--seal); color:#fff;
    border-radius:2px;
  }
  .form button.ghost{background:none; color:var(--ink-dim); border-color:var(--rule)}
  .form .note{flex:1 1 100%; font-size:12px; color:var(--ink-faint); line-height:1.6}

  .colophon{
    margin-top:34px; padding-top:14px; border-top:1px solid var(--rule-soft);
    font-size:11.5px; line-height:1.75; color:var(--ink-faint);
  }
  .colophon b{color:var(--ink-dim); font-weight:500}

  .demo-flag{
    display:inline-block; font-family:var(--mono); font-size:10.5px; letter-spacing:.08em;
    color:var(--seal); border:1px solid var(--seal); border-radius:2px; padding:0 5px 1px;
  }

  @media (max-width:900px){
    .reading{grid-template-columns:1fr; gap:28px}
    .ledger{border-right:none; padding-right:0; border-bottom:1px solid var(--rule); padding-bottom:20px}
    .panels{grid-template-columns:1fr}
    .panel{border-right:none; border-bottom:1px solid var(--rule); padding:16px 0 18px}
    .panel:last-child{border-bottom:none}
    .scale{grid-template-columns:repeat(3,1fr)}
    .scale button:nth-child(3){border-right:none}
  }
  @media (max-width:640px){
    .board{grid-template-columns:repeat(5,1fr)}
    .board .rowlabel{display:none}
    .week .days{grid-template-columns:repeat(4,1fr)}
    .week .day{min-height:98px}
    .verdict{grid-template-columns:1fr}
    .verdict div+div{border-left:none; border-top:1px solid var(--rule)}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}
</style>

<div class="wrap">
  <header class="masthead">
    <div class="brand">
      <h1>운의 시간표</h1>
      <span class="stamp">曆</span>
    </div>
    <div class="today">
      <div class="d" id="todayDate">—</div>
      <div class="gz" id="todayGz">—</div>
    </div>
  </header>

  <div class="subline" id="subline"></div>

  <section class="daily" id="daily" aria-label="오늘"></section>

  <section class="board" id="board" aria-label="명식과 운"></section>

  <nav class="scale" id="scale" role="tablist" aria-label="기간 선택"></nav>

  <section class="reading">
    <div class="ledger">
      <dl id="ledger"></dl>
    </div>
    <div class="prose" id="prose"></div>
  </section>

  <section class="week" id="weekBox" hidden>
    <h3 class="weekhead">이번 주 일진 <span>— 원국과 가장 세게 걸리는 날에 표시했습니다</span></h3>
    <div class="days" id="weekDays"></div>
  </section>

  <section class="foot">
    <div class="panels">
      <div class="panel">
        <h3>오행 분포</h3>
        <div class="bars" id="ohengBars"></div>
        <dl class="kv" style="margin-top:14px" id="structKv"></dl>
      </div>
      <div class="panel">
        <h3>원국 신살</h3>
        <div id="natalSinsal"></div>
      </div>
      <div class="panel">
        <h3>대운</h3>
        <div class="daewoon" id="daewoon"></div>
        <dl class="kv" style="margin-top:12px" id="daewoonKv"></dl>
      </div>
    </div>
  </section>

  <details class="settings" id="settings">
    <summary>생년월일시 바꾸기 · 다른 사람 사주 보기</summary>
    <form class="form" id="birthForm">
      <div class="field">
        <label for="bname">이름표</label>
        <input type="text" id="bname" placeholder="나" size="8" maxlength="12">
      </div>
      <div class="field">
        <label for="bdate">생년월일</label>
        <input type="date" id="bdate" min="1900-02-05" max="2045-12-31" required>
      </div>
      <div class="field">
        <label for="btime">태어난 시각</label>
        <input type="time" id="btime">
      </div>
      <div class="field">
        <label for="bunknown">시각</label>
        <select id="bunknown">
          <option value="known">안다</option>
          <option value="unknown">모른다 (시주 제외)</option>
        </select>
      </div>
      <div class="field">
        <label for="bgender">성별</label>
        <select id="bgender"><option value="M">남</option><option value="F">여</option></select>
      </div>
      <button type="submit">적용</button>
      <button type="button" class="ghost" id="resetBtn">되돌리기</button>
      <p class="note">
        태어난 날 그때 시계가 가리킨 시각을 넣으면 됩니다. 1908~1911·1954~1961년의 UTC+8:30 표준시와 서머타임 연도는 자동으로 반영하고, 서울 경도 보정(지방평균시, 지금 표준시 기준 −32분)은 시주에만 적용합니다.
        입력한 정보는 이 브라우저에만 저장되며 어디로도 전송되지 않습니다.
      </p>

  const gm = gongmang(dp);
  const gmHit = zhis.filter(z => z && gm.includes(z));
  push("공망", "A~B", `공망지 ${gm}` + (gmHit.length ? ` — ${gmHit.map(z => posOf(z)[0] + " " + z).join("·")}` : " — 원국에 없음"));
  const bh = pillars.filter(p => p && BAEKHO.includes(p));
  if (bh.length) push("백호대살", "B", bh.join("·"));
  const kg = pillars.filter(p => p && GWAEGANG.includes(p));
  if (kg.length) push("괴강", "B", kg.join("·"));
  if (zhis.includes(GEUMYEO[dayGan])) push("금여", "C", GEUMYEO[dayGan]);
  if (zhis.includes(HONGYEOM[dayGan])) push("홍염살", "C~D", HONGYEOM[dayGan] + " — 근거가 얇은 항목");
  if (zhis.includes("戌") && zhis.includes("亥")) push("천라", "C", "戌亥");
  if (zhis.includes("辰") && zhis.includes("巳")) push("지망", "C", "辰巳");

  // 원국 내부 관계
  const inner = [];
  const labs = ["년", "월", "일", "시"];
  for (let i = 0; i < 4; i++) for (let j = i + 1; j < 4; j++) {
    if (!zhis[i] || !zhis[j]) continue;
    const r = zhiRel(zhis[i], zhis[j]);
    if (r.length) inner.push({ a: labs[i] + "지" + zhis[i], b: labs[j] + "지" + zhis[j], r });
  }

  // 대운
  const dw = daewoon(profile, yp[0], mp, instMin, slot);

  return { profile, pillars, zhis, dayGan, yearZhi: yp[1], dayZhi: dp[1],
           slot, cnt, roots, gyeok, gyeokList, sinsal, inner, dw, gongmangZhi: gm,
           guk: gukOf(yp[1]), gukDay: gukOf(dp[1]), timeKnown: known, birthMin: instMin, solarMin: corrected,
           tz: { off, dst, corr } };
}

const ROK = T.ROK;
const GYEOK_NAME = { 정관: "정관격", 편관: "칠살격", 정인: "정인격", 편인: "편인격", 정재: "정재격", 편재: "편재격", 식신: "식신격", 상관: "상관격" };

/** 격 1차 후보 이름 — ① 辰戌丑未 잡기 ② 건록 ③ 양인 ④ 월겁 ⑤ 본기 우선 + 변화 후보 (references/34·35, errata #20) */
function gyeokCandidates(pillars) {
  const day = pillars[2][0], mz = pillars[1][1];
  const others = [pillars[0][0], pillars[1][0]].concat(pillars[3] ? [pillars[3][0]] : []);
  const jang = JANGGAN[mz].split(""), bongi = jang[jang.length - 1];
  const tou = jang.slice().reverse().filter(g => others.includes(g));      // 본기→중기→여기
  const nm = g => GYEOK_NAME[sipsin(day, g)];
  const ok = g => !!nm(g);                                                // 비겁은 격이 되지 않는다
  const og = g => OG[GAN.indexOf(g)];
  const out = [];
  if ("辰戌丑未".includes(mz)) {
    const useful = tou.filter(ok);
    useful.forEach(g => out.push(`잡기 ${nm(g)}`));
    const same = [...new Set(others.filter(o => !useful.includes(o) && ok(o) && jang.some(j => ok(j) && og(j) === og(o))))];
    same.forEach(o => out.push(`잡기 ${nm(o)}(같은 오행 투간)`));
    if (ok(bongi) && !useful.includes(bongi)) out.push(`잡기 ${nm(bongi)}(본기·미투출)`);
    if (!out.length) out.push("잡기 — 본기 비겁");
    else if (tou.some(g => !ok(g))) out.push("잡기 월겁(비겁 투출)");
  } else if (ROK[day] === mz) out.push("건록격");
  else if (YANGIN[day] === mz) out.push("양인격");
  else if (sipsin(day, bongi) === "겁재") out.push("월겁격");
  else {
    out.push(nm(bongi));
    tou.forEach(g => { if (g !== bongi && ok(g)) out.push(nm(g) + "(변화 후보)"); });
  }
  return out;
}

function daewoon(profile, yearGan, monthGz, birthMin, slot) {
  const yangYear = !YIN(GAN.indexOf(yearGan));
  const forward = (yangYear && profile.gender === "M") || (!yangYear && profile.gender === "F");
  const days = forward ? (slot.end - birthMin) / 1440 : (birthMin - slot.start) / 1440;
  let startAge = Math.floor(days / 3 + 0.5); if (startAge === 0) startAge = 1;
  const m60 = gzIndex(monthGz);
  const list = [];
  const birthYear = kd(birthMin).getUTCFullYear();
  for (let n = 1; n <= 9; n++) {
    list.push({ gz: gz(forward ? m60 + n : m60 - n), age: startAge + 10 * (n - 1), year: birthYear + startAge + 10 * (n - 1) });
  }
  return { forward, startAge, list, rule: `연간 ${yearGan}(${yangYear ? "양" : "음"}간) · ${profile.gender === "M" ? "남명" : "여명"} → ${forward ? "순행" : "역행"}` };
}

/* ══ 기간 판독 ══════════════════════════════════ */
function relationsTo(natal, targetZhi) {
  const labs = ["년", "월", "일", "시"], out = [];
  for (let i = 0; i < 4; i++) {
    if (!natal.zhis[i]) continue;
    const r = zhiRel(natal.zhis[i], targetZhi);
    if (r.length) out.push({ pos: labs[i], zhi: natal.zhis[i], rel: r,
                             weight: Math.max(...r.map(x => (REL_INFO[x] || { w: 1 }).w)) });
  }
  return out.sort((a, b) => b.weight - a.weight);
}

function readPeriod(natal, ganzhi, startMin, endMin, meta) {
  const g = ganzhi[0], z = ganzhi[1];
  const gO = OG[GAN.indexOf(g)], zO = OZ[ZHI.indexOf(z)];
  let gzRel;
  if (SHENG[zO] === gO) gzRel = "지지가 천간을 생한다 — 뿌리가 받쳐준다";
  else if (SHENG[gO] === zO) gzRel = "천간이 지지를 생한다 — 힘이 아래로 빠진다";
  else if (KE[gO] === zO) gzRel = "천간이 지지를 극한다(개두) — 하려는 것과 실제가 어긋난다";
  else if (KE[zO] === gO) gzRel = "지지가 천간을 극한다(절각) — 뜻은 있으나 발이 묶인다";
  else gzRel = "천간과 지지가 같은 기운 — 색이 진하고 단순하다";

  const s12y = sinsal12(natal.yearZhi, z);
  const s12d = sinsal12(natal.dayZhi, z);
  const unY = unseong(natal.dayGan, z, "eum");
  const unYang = unseong(natal.dayGan, z, "yang");
  const rels = relationsTo(natal, z);

  // 십신 인종
  const incho = GAN.split("").map(x => ({ s: sipsin(natal.dayGan, x), gan: x, un: unseong(x, z, "eum") }));
  const alive = incho.filter(x => UN_POWER[x.un] >= 2);
  const down  = incho.filter(x => UN_POWER[x.un] <= -1);
  const groups = a => [...new Set(a.map(x => SIPSIN_GROUP[x.s]))];

  return { ganzhi, g, z, gO, zO, gzRel, s12y, s12d, unY, unYang, rels,
           incho, alive, down, aliveG: groups(alive), downG: groups(down),
           startMin, endMin, meta,
           gongmang: natal.gongmangZhi.includes(z) };
}

/* ══ 렌더 ═══════════════════════════════════════ */
const kdr = m => kd(Math.floor(m + 0.5));                 // 절입 시각(초 단위)을 분으로 반올림해 표시
const fmtD  = m => { const d = kdr(m); return `${d.getUTCFullYear()}.${String(d.getUTCMonth() + 1).padStart(2, "0")}.${String(d.getUTCDate()).padStart(2, "0")}`; };
const fmtDT = m => { const d = kdr(m); return `${fmtD(m)} ${String(d.getUTCHours()).padStart(2, "0")}:${String(d.getUTCMinutes()).padStart(2, "0")}`; };
const fmtMD = m => { const d = kdr(m); return `${String(d.getUTCMonth() + 1).padStart(2, "0")}/${String(d.getUTCDate()).padStart(2, "0")}`; };
const gzKo  = s => GAN_KO[GAN.indexOf(s[0])] + ZHI_KO[ZHI.indexOf(s[1])];
const el = (t, c, h) => { const n = document.createElement(t); if (c) n.className = c; if (h != null) n.innerHTML = h; return n; };

let NATAL, PERIODS, CURRENT = "month0";

function computePeriods(natal) {
  const now = kmin(nowKd());
  const out = {};

  // 월운
  const s0 = jieSlot(now), s1 = slotByIndex(s0.i + 1);
  [[s0, "month0", "이번 달"], [s1, "month1", "다음 달"]].forEach(([s, key, label]) => {
    const yp = yearPillar(s.jieYear), mz = MONTH_ZHI[s.k];
    out[key] = { kind: "month", label, ganzhi: monthGan(yp[0], mz) + mz, start: s.start, end: s.end,
                 note: `${JIE[s.k]} → ${JIE[(s.k + 1) % 12]} 직전`, slot: s };
  });

  // 세운
  const jy = s0.jieYear;
  [[jy, "year0", "올해"], [jy + 1, "year1", "내년"]].forEach(([y, key, label]) => {
    out[key] = { kind: "year", label, ganzhi: yearPillar(y), start: termAt(y, 0), end: termAt(y + 1, 0),
                 note: `${y}년 입춘 → ${y + 1}년 입춘 직전`, jieYear: y };
  });

  // 주운 — 월요일 시작
  const today = kd(now);
  const midnight = Math.floor(now / 1440) * 1440;
  const dow = (today.getUTCDay() + 6) % 7;                 // 월=0
  [[0, "week0", "이번 주"], [1, "week1", "다음 주"]].forEach(([off, key, label]) => {
    const mon = midnight - dow * 1440 + off * 7 * 1440;
    const days = [];
    for (let i = 0; i < 7; i++) {
      const dm = mon + i * 1440 + 720;                     // 정오 기준
      const dgz = dayPillar(dm);
      const rels = relationsTo(natal, dgz[1]);
      days.push({ min: mon + i * 1440, gz: dgz, rels, w: rels.reduce((a, r) => a + r.weight, 0),
                  isToday: mon + i * 1440 === midnight });
    }
    const bg = jieSlot(mon + 3 * 1440 + 720);
    const ypb = yearPillar(bg.jieYear), mzb = MONTH_ZHI[bg.k];
    out[key] = { kind: "week", label, days, start: mon, end: mon + 7 * 1440 - 1,
                 monthGz: monthGan(ypb[0], mzb) + mzb,
                 ganzhi: days.slice().sort((a, b) => b.w - a.w || a.min - b.min)[0].gz,
                 note: `${fmtMD(mon)} 월요일 → ${fmtMD(mon + 6 * 1440)} 일요일` };
  });
  return out;
}

function render() {
  const n = NATAL, p = PERIODS[CURRENT];
  const rd = readPeriod(n, p.ganzhi, p.start, p.end, p);

  /* 마스트헤드 */
  const now = kmin(nowKd()), tgz = dayPillar(now), tslot = jieSlot(now);
  const td = kd(now);
  document.getElementById("todayDate").textContent =
    `${td.getUTCFullYear()}년 ${td.getUTCMonth() + 1}월 ${td.getUTCDate()}일 ${"일월화수목금토"[td.getUTCDay()]}요일`;
  document.getElementById("todayGz").innerHTML =
    `오늘의 일진 <span class="m${OZ[ZHI.indexOf(tgz[1])]}">${tgz}</span> <em>${gzKo(tgz)}</em>`;

  const sub = document.getElementById("subline");
  sub.innerHTML = "";
  const nm = n.profile.name || "명식";
  const addSub = (k, v) => { sub.append(el("span", "", `<span class="k">${k}</span> ${v}`)); };
  addSub("명식", `${nm}${n.profile.demo ? ' <span class="demo-flag">예시</span>' : ""}`);
  addSub("일간", `<b class="m${OG[GAN.indexOf(n.dayGan)]}">${n.dayGan}</b> ${GAN_KO[GAN.indexOf(n.dayGan)]}${OG[GAN.indexOf(n.dayGan)]} · ${GAN_DESC[n.dayGan]}`);
  addSub("띠", `${ANIMAL[ZHI.indexOf(n.yearZhi)]}띠 · ${n.guk} ${GUK_NAME[n.guk]} 기준`);
  addSub("절기", `${JIE[tslot.k]} 이후 ${Math.floor((now - tslot.start) / 1440)}일째`);

  renderDaily(n);

  /* 명식 그리드 */
  const board = document.getElementById("board");
  board.innerHTML = "";
  const rows = [
    { key: "cap" }, { key: "gan" }, { key: "zhi" },
    { key: "sipsin", label: "십신" }, { key: "sinsal", label: "12신살" }, { key: "unseong", label: "십이운성" }
  ];
  const cols = [
    { cap: `${p.label} · ${p.kind === "week" ? "핵심 일진" : p.kind === "month" ? "월운" : "세운"}`, gz: rd.ganzhi, unse: true },
    { cap: "시주", gz: n.pillars[3] }, { cap: "일주", gz: n.pillars[2], isDay: true },
    { cap: "월주", gz: n.pillars[1] }, { cap: "년주", gz: n.pillars[0] }
  ];
  // grid는 행 단위로 채운다
  rows.forEach(r => {
    board.append(el("div", "rowlabel", r.label || ""));
    cols.forEach(col => {
      const cell = el("div", "col" + (col.unse ? " unse" : ""));
      cell.style.borderRight = "1px solid var(--rule-soft)";
      if (!col.gz) {
        cell.innerHTML = r.key === "cap" ? `<div class="cap">${col.cap}</div>`
          : r.key === "gan" ? `<div class="glyph" style="color:var(--ink-faint)">—<span class="ko">시각 미상</span></div>`
          : r.key === "zhi" ? `<div class="glyph" style="color:var(--ink-faint)">—<span class="ko">시주 제외</span></div>`
          : `<div class="slot"><b>·</b></div>`;
        board.append(cell); return;
      }
      const G = col.gz[0], Z = col.gz[1];
      if (r.key === "cap") cell.innerHTML = `<div class="cap">${col.cap}</div>`;
      else if (r.key === "gan") cell.innerHTML = `<div class="glyph m${OG[GAN.indexOf(G)]}">${G}<span class="ko">${GAN_KO[GAN.indexOf(G)]}</span></div>`;
      else if (r.key === "zhi") cell.innerHTML = `<div class="glyph m${OZ[ZHI.indexOf(Z)]}">${Z}<span class="ko">${ZHI_KO[ZHI.indexOf(Z)]}·${ANIMAL[ZHI.indexOf(Z)]}</span></div>`;
      else if (r.key === "sipsin") cell.innerHTML = `<div class="slot"><b>${col.isDay ? "일간 " + G : sipsin(n.dayGan, G)}</b><span class="alt">지지 ${sipsin(n.dayGan, JANGGAN[Z].slice(-1))}</span></div>`;
      else if (r.key === "sinsal") cell.innerHTML = `<div class="slot"><b>${sinsal12(n.yearZhi, Z)}</b><span class="alt">일지 기준 ${sinsal12(n.dayZhi, Z)}</span></div>`;
      else cell.innerHTML = `<div class="slot"><b>${unseong(n.dayGan, Z, "eum")}</b><span class="alt">양포태 ${unseong(n.dayGan, Z, "yang")}</span></div>`;
      board.append(cell);
    });
  });

  /* 눈금 */
  const scale = document.getElementById("scale");
  if (!scale.dataset.built) {
    [["week0", "이번 주"], ["week1", "다음 주"], ["month0", "이번 달"], ["month1", "다음 달"], ["year0", "올해"], ["year1", "내년"]]
      .forEach(([k, lab]) => {
        const b = el("button", "", `<span class="t">${k.startsWith("week") ? "WEEK" : k.startsWith("month") ? "MONTH" : "YEAR"}</span><span class="n">${lab}</span> <span class="gz"></span>`);
        b.type = "button"; b.setAttribute("role", "tab"); b.dataset.k = k;
        b.addEventListener("click", () => { CURRENT = k; render(); });
        scale.append(b);
      });
    scale.dataset.built = "1";
  }
  [...scale.children].forEach(b => {
    const pd = PERIODS[b.dataset.k];
    b.setAttribute("aria-selected", b.dataset.k === CURRENT ? "true" : "false");
    b.querySelector(".gz").innerHTML = `<span class="mono" style="font-size:11px;color:var(--ink-faint)">${pd.kind === "week" ? fmtMD(pd.start) : pd.ganzhi}</span>`;
  });

  /* 원장 */
  const L = document.getElementById("ledger");
  L.innerHTML = "";
  const row = (k, v) => { const d = el("div", "ldr-row"); d.innerHTML = `<dt>${k}</dt><dd>${v}</dd>`; L.append(d); };
  row("간지", `<span class="m${rd.gO}" style="font-family:var(--serif);font-size:19px;font-weight:600">${rd.ganzhi}</span> <span class="mono" style="font-size:12px;color:var(--ink-dim)">${gzKo(rd.ganzhi)}</span><span class="sub">${rd.gzRel}</span>`);
  row("기간", `<span class="mono">${p.kind === "year" || p.kind === "month" ? fmtDT(p.start) : fmtD(p.start)}</span><span class="sub">→ ${p.kind === "year" || p.kind === "month" ? fmtDT(p.end) : fmtD(p.end)} · ${p.note}</span>`);
  if (p.kind === "week") row("배경", `월운 <b>${p.monthGz}</b><span class="sub">주(週)는 명리 고유 단위가 아니라, 일진 7개를 묶어 본 배치입니다.</span>`);
  row("12신살", `<span class="tag hit">${rd.s12y}</span><span class="sub">년지 ${n.yearZhi} · ${n.guk}(${GUK_NAME[n.guk]}) 기준 — ${SINSAL_DESC[rd.s12y].tag}</span>` +
      (rd.s12d !== rd.s12y ? `<span class="sub">일지 ${n.dayZhi} 기준으로는 <b>${rd.s12d}</b> — 두 기준이 갈립니다</span>` : ""));
  row("십이운성", `<span class="tag ${UN_POWER[rd.unY] >= 2 ? "wang" : UN_POWER[rd.unY] <= -1 ? "swe" : ""}">${rd.unY}</span><span class="sub">일간 ${n.dayGan} 기준 · 음포태. 양포태로는 ${rd.unYang}</span>`);
  row("십신", (rd.alive.length ? `살아있는 쪽 ${rd.alive.map(x => `<span class="tag wang">${x.s}·${x.un}</span>`).join("")}` : "두드러지게 살아있는 십신 없음") +
      (rd.down.length ? `<span class="sub" style="margin-top:5px">눌린 쪽 ${rd.down.map(x => `<span class="tag swe">${x.s}·${x.un}</span>`).join("")}</span>` : ""));
  row("관계", rd.rels.length
    ? `<ul class="rels" style="margin:0">${rd.rels.map(r => `<li><span class="who">${r.pos}지 ${r.zhi}</span><span class="what"><b>${r.rel.join(" · ")}</b> <span>${GUNG[r.pos].short}</span></span></li>`).join("")}</ul>`
    : "원국 지지와 직접 걸리는 관계 없음 — 조용한 구간");
  if (rd.gongmang) row("공망", `<b>${rd.z}</b>는 일주 기준 공망지<span class="sub">뜻은 서는데 실체가 덜 잡히는 결. 학파에 따라 운에서 채워지면 정상 작동으로 봅니다.</span>`);

  /* 서술 */
  const zd = ZHI_DESC[rd.z], sd = SINSAL_DESC[rd.s12y];
  const PR = document.getElementById("prose");
  const relTop = rd.rels[0];
  const headline = p.kind === "week"
    ? `${p.label} — ${sd.tag}`
    : `${rd.ganzhi}${p.kind === "month" ? "월" : "년"} — ${sd.tag}`;

  let html = `<h2>${headline}</h2><p class="lede">${zd.theme}</p>`;

  html += `<h3>이 기간의 배경</h3>`;
  html += `<p><b>${rd.z}(${ZHI_KO[ZHI.indexOf(rd.z)]})</b>는 ${zd.season}, 하루로 치면 ${zd.clock}에 해당하는 ${zd.kind}입니다. ${zd.img}.
           천간 <b>${rd.g}</b>는 ${GAN_DESC[rd.g]}. ${rd.gzRel}.</p>`;
  if (p.kind === "week") html += `<p>배경이 되는 달은 <b>${p.monthGz}</b>월입니다. 주간의 결은 이 달의 기조 안에서 움직이며, 아래 7일의 일진이 그 안에서 강약을 만듭니다.</p>`;

  html += `<h3>나에게 — 일간 ${n.dayGan}</h3>`;
  html += `<p>${n.dayGan} 일간에게 ${rd.z}는 <b>${rd.unY}</b>의 자리입니다. ${UN_DESC[rd.unY]}</p>`;
  if (rd.aliveG.length) html += `<p><b>쓸 수 있는 카드</b> — ${rd.aliveG.map(g => `${g}(${GROUP_DESC[g]})`).join(", ")}. ${rd.alive.slice(0, 3).map(x => `${x.s}가 ${x.un}`).join(", ")}에 들어 이쪽으로 손을 대면 붙습니다.</p>`;
  if (rd.downG.length) html += `<p><b>기대를 낮출 영역</b> — ${rd.downG.map(g => `${g}`).join(", ")}. ${rd.down.slice(0, 3).map(x => `${x.s}가 ${x.un}`).join(", ")}이라 힘을 실어도 되돌아오는 게 적습니다.</p>`;

  html += `<h3>나에게 — 12신살 ${rd.s12y}</h3>`;
  html += `<p>년지 ${n.yearZhi}(${ANIMAL[ZHI.indexOf(n.yearZhi)]}띠)는 ${n.guk} ${GUK_NAME[n.guk]}에 속합니다. 그 기준으로 ${rd.z}는 <b>${rd.s12y}</b> 자리입니다.</p>`;
  html += `<p><b>이렇게 쓰면 순방향</b> — ${sd.plus}<br><b>이렇게 가면 소모</b> — ${sd.minus}</p>`;
  if (rd.s12d !== rd.s12y) html += `<p style="color:var(--ink-dim)">일지 ${n.dayZhi} 기준으로 보면 같은 자리가 <b>${rd.s12d}</b>가 됩니다. 12신살 기준 지지는 학파가 갈리는 지점이라 둘 다 적어 둡니다 — 총운은 년지, 개인의 체감은 일지 쪽으로 읽는 견해가 많습니다.</p>`;

  html += `<h3>원국과 맞물리는 자리</h3>`;
  if (rd.rels.length) {
    html += `<ul class="rels">` + rd.rels.map(r => {
      const main = r.rel.find(x => REL_INFO[x]) || r.rel[0];
      return `<li><span class="who">${r.pos}지 ${r.zhi}</span><span class="what"><b>${r.rel.join(" · ")}</b> — ${(REL_INFO[main] || { t: "" }).t}<br><span>영역: ${GUNG[r.pos].area}</span></span></li>`;
    }).join("") + `</ul>`;
    html += `<p style="margin-top:12px">가장 세게 걸리는 자리는 <b>${relTop.pos}지</b>입니다. 이 기간의 일은 주로 ${GUNG[relTop.pos].area} 쪽에서 생깁니다.</p>`;
  } else {
    html += `<p>원국 지지와 직접 걸리는 합·충·형·파·해·원진·귀문·격각이 없습니다. 사건이 밖에서 밀고 들어오기보다, 위의 십이운성과 12신살이 만드는 <b>내부 온도</b>로 지나가는 구간입니다.</p>`;
  }

  html += `<div class="verdict"><div class="do"><span class="lab">이 기간에 할 것 하나</span><strong>${sd.act}</strong></div>` +
          `<div><span class="lab">접을 것 하나</span><strong>${sd.stop}</strong></div></div>`;
  PR.innerHTML = html;

  /* 주간 스트립 */
  const wb = document.getElementById("weekBox");
  if (p.kind === "week") {
    wb.hidden = false;
    const wd = document.getElementById("weekDays");
    wd.innerHTML = "";
    const maxW = Math.max(...p.days.map(d => d.w));
    p.days.forEach((d, i) => {
      const marked = d.w >= 4 && d.w === maxW;
      const c = el("div", "day" + (d.isToday ? " today" : "") + (marked ? " marked" : ""));
      const top = d.rels[0];
      c.innerHTML = `<span class="dow">${"MON TUE WED THU FRI SAT SUN".split(" ")[i]}</span>` +
        `<span class="dt">${fmtMD(d.min)}</span>` +
        `<span class="gz m${OZ[ZHI.indexOf(d.gz[1])]}">${d.gz}</span>` +
        `<span class="mk">${top ? top.rel[0] + " · " + GUNG[top.pos].short : ""}</span>` +
        `<span class="s12">${sinsal12(n.yearZhi, d.gz[1])}</span>`;
      wd.append(c);
    });
  } else wb.hidden = true;

  /* 하단 패널 */
  const bars = document.getElementById("ohengBars");
  bars.innerHTML = "";
  const total = Object.values(n.cnt).reduce((a, b) => a + b, 0) || 1;
  ["木", "火", "土", "金", "水"].forEach(o => {
    const b = el("div", "bar");
    b.innerHTML = `<span class="nm m${o}">${o}</span><span class="tr"><span class="fl b${o}" style="width:${(n.cnt[o] / total * 100).toFixed(1)}%"></span></span><span class="ct">${n.cnt[o]}</span>`;
    bars.append(b);
  });
  const sk = document.getElementById("structKv");
  sk.innerHTML = `<dt>격 후보</dt><dd>${n.gyeok}<br><span style="font-size:11px">월령 본기 우선(건록·양인·잡기 별도)으로 뽑은 1차 후보입니다. 용신·격의 성패 판정은 별도 감명이 필요합니다.</span></dd>` +
                 `<dt>일간 뿌리</dt><dd>${n.roots.length ? "<b>" + n.roots.join(" · ") + "</b>" : "<b>무근(無根)</b>"}</dd>`;

  const ns = document.getElementById("natalSinsal");
  ns.innerHTML = n.sinsal.map(s => `<div style="padding:5px 0;border-bottom:1px dotted var(--rule-soft);font-size:12.5px"><b style="font-weight:500">${s.n}</b> <span class="tag">${s.g}</span><br><span style="color:var(--ink-dim);font-size:12px">${s.v}</span></div>`).join("") +
    `<div style="padding:7px 0;font-size:12.5px;color:var(--ink-dim)">삼재 — ${n.guk}생은 <b style="color:var(--ink)">${SAMJAE[n.guk]}</b>년<span class="tag" style="margin-left:6px">B~C</span></div>` +
    (n.inner.length ? `<div style="margin-top:10px"><span class="eyebrow">원국 내부 관계</span><br>${n.inner.map(x => `<span style="font-size:12.5px;color:var(--ink-dim)">${x.a}—${x.b} <b style="color:var(--ink)">${x.r.join("·")}</b></span>`).join("<br>")}</div>` : "");

  const dwBox = document.getElementById("daewoon");
  dwBox.innerHTML = "";
  const curJieYear = jieSlot(kmin(nowKd())).jieYear;
  let curIdx = -1;
  n.dw.list.forEach((d, i) => { if (curJieYear >= d.year) curIdx = i; });
  n.dw.list.forEach((d, i) => {
    const c = el("div", "dw" + (i === curIdx ? " on" : ""));
    c.innerHTML = `<span class="a">${d.age}세</span><span class="g m${OZ[ZHI.indexOf(d.gz[1])]}">${d.gz}</span><span class="a">${d.year}</span>`;
    dwBox.append(c);
  });
  const cur = curIdx >= 0 ? n.dw.list[curIdx] : null;
  document.getElementById("daewoonKv").innerHTML =
    `<dt>순역</dt><dd>${n.dw.rule}</dd>` +
    (cur ? `<dt>현재</dt><dd><b>${cur.gz}</b> 대운 (${cur.age}세~) · 천간 ${sipsin(n.dayGan, cur.gz[0])} / 지지 ${sipsin(n.dayGan, JANGGAN[cur.gz[1]].slice(-1))} · 12신살 <b>${sinsal12(n.yearZhi, cur.gz[1])}</b></dd>` : "");

  /* 콜로폰 */
  document.getElementById("colophon").innerHTML =
    `<b>계산 기준</b> · 절기는 태양 겉보기 황경 315°+30°k 통과 시각(KST, 초 단위 실계산·분 단위 반올림 표시). 연주는 입춘, 월주는 절입 기준이며 출생 순간과 절입 순간을 그대로 비교합니다. 일주는 1900-01-01=甲戌 기준이며 보정 후 23:01 이후 출생은 익일로 넘깁니다. 시주는 서울 경도 보정(지방평균시) 후 시각으로 뽑습니다.<br>` +
    `<b>이론 근거</b> · 십이신살은 년지 삼합국 기준(일지 기준 병기), 십이운성은 음포태(양포태 병기), 지지 관계는 합·충·형·파·해에 원진·귀문·격각을 더해 봅니다. 신살에는 신뢰도 등급(A~D)을 붙였고 C·D는 단독 판정에 쓰지 않습니다.<br>` +
    `<b>읽는 법</b> · 이 페이지는 <b>신살·십이운성·지지 관계</b> 층위를 그린 것입니다. 격국과 용신의 성패 판정은 담고 있지 않으므로, 여기 나온 길흉의 결은 참고이지 결론이 아닙니다. 운은 원국이라는 그릇 안의 변동이고, 층위 비중은 원국 55 · 대운 25 · 세운 12 · 월운 5 · 일운 3입니다.<br>` +
    `<b>마지막 갱신</b> · <span class="mono">${fmtDT(kmin(nowKd()))}</span>`;
}

/* ══════════════════════════════════════════════════════════════
   DAILY — 매일 아침 다시 쓰이는 구간. 이 블록만 갱신됩니다.
   for      : 이 글이 가리키는 날짜 (KST, YYYY-MM-DD)
   profile  : 이 글을 쓴 기준 명식 "생년월일|시각|성별"
   ══════════════════════════════════════════════════════════════ */
const DAILY = {
  for: "2026-09-06",
  profile: "1990-05-15|09:30|M",
  title: "묶이는 날 — 자리가 정해지는 결",
  body: "오늘 일진 癸未는 년지 午와 육합, 월지 巳와 함께 巳午未 방합으로 묶입니다. 총운과 소속이 같은 방향으로 한 번에 당겨지는 날이라, 혼자 판단하는 것보다 이미 엮여 있는 사람들 쪽에서 답이 나옵니다. 일간 庚에게 未는 관대(冠帶) — 형식을 갖추는 자리입니다. 의욕이 실제보다 반 발쯤 앞서 있으니, 오늘 벌이는 것보다 오늘 정리해서 이름을 붙이는 쪽이 남습니다. 12신살로는 반안살, 자리에 오르는 결입니다. 천간 癸는 상관이라 말이 앞설 수 있는데, 묶이는 날의 말실수는 두 배로 갑니다.",
  act: "이미 하고 있는 일 하나에 공식적인 이름·직함·일정을 붙인다"
};

function renderDaily(natal) {
  const box = document.getElementById("daily");
  const now = kmin(nowKd());
  const todayKey = fmtD(now).replace(/\./g, "-");
  const gzT = dayPillar(now);
  const zT = gzT[1];
  const s12 = sinsal12(natal.yearZhi, zT);
  const un = unseong(natal.dayGan, zT, "eum");
  const rels = relationsTo(natal, zT);
  const sameProfile = `${natal.profile.date}|${natal.profile.time}|${natal.profile.gender}` === DAILY.profile;
  const fresh = DAILY.for === todayKey && sameProfile;

  const meta = `<div class="meta">` +
    `<div>12신살 <b>${s12}</b> · ${SINSAL_DESC[s12].tag}</div>` +
    `<div>십이운성 <b>${un}</b></div>` +
    `<div>${rels.length ? rels.map(r => `${r.pos}지 <b>${r.rel[0]}</b>`).join(" · ") : "원국과 직접 걸리는 관계 없음"}</div></div>`;

  let right;
  if (fresh) {
    right = `<div><h2>${DAILY.title}</h2><p>${DAILY.body}</p>` +
            `<div class="act">오늘 할 것 하나 — <b>${DAILY.act}</b></div></div>`;
  } else {
    const top = rels[0];
    right = `<div><h2>오늘 — ${SINSAL_DESC[s12].tag}</h2>` +
      `<p>일간 ${natal.dayGan}에게 ${zT}는 <b>${un}</b>의 자리입니다. ${UN_DESC[un]} 년지 ${natal.yearZhi} 기준으로는 <b>${s12}</b> — ${SINSAL_DESC[s12].plus}</p>` +
      `<p>${top ? `원국에서는 ${top.pos}지 ${top.zhi}와 <b>${top.rel.join("·")}</b>으로 걸립니다. 오늘의 일은 ${GUNG[top.pos].area} 쪽에서 생기기 쉽습니다.` : "원국 지지와 직접 걸리는 관계가 없어, 밖에서 밀고 들어오는 일보다 안에서 정해지는 결로 지나갑니다."}</p>` +
      `<div class="act">오늘 할 것 하나 — <b>${SINSAL_DESC[s12].act}</b></div>` +
      (DAILY.for !== todayKey
        ? `<div class="stale">이 자리에 들어가는 아침 글은 ${DAILY.for} 기준으로 쓰인 것이라, 위 내용은 오늘 날짜로 다시 계산해 자동으로 채운 것입니다.</div>`
        : `<div class="stale">아침 글은 기본 명식 기준으로 쓰입니다. 지금은 직접 입력한 명식으로 보고 계셔서, 오늘 자리는 계산값으로 채웠습니다.</div>`) +
      `</div>`;
  }

  box.innerHTML =
    `<div class="stampcol"><div class="ilju m${OZ[ZHI.indexOf(zT)]}">${gzT}<small>${gzKo(gzT)} · 오늘의 일진</small></div>${meta}</div>` + right;
}

/* ══ 프로필 ═════════════════════════════════════ */
const DEFAULT_PROFILE = { name: "", date: "1990-05-15", time: "09:30", timeKnown: true, gender: "M", demo: true };
const STORE = "unsi-profile-v1";

function loadProfile() {
  try { const s = localStorage.getItem(STORE); if (s) return JSON.parse(s); } catch (e) {}
  return { ...DEFAULT_PROFILE };
}
function saveProfile(p) { try { localStorage.setItem(STORE, JSON.stringify(p)); } catch (e) {} }

function boot(profile) {
  NATAL = buildNatal(profile);
  PERIODS = computePeriods(NATAL);
  render();
  const f = document.getElementById("birthForm");
  f.bname.value = profile.name || "";
  f.bdate.value = profile.date;
  f.btime.value = profile.time || "12:00";
  f.bunknown.value = profile.timeKnown ? "known" : "unknown";
  f.bgender.value = profile.gender;
}

document.getElementById("birthForm").addEventListener("submit", e => {
  e.preventDefault();
  const f = e.target;
  if (!f.bdate.value) return;
  const p = { name: f.bname.value.trim(), date: f.bdate.value, time: f.btime.value || "12:00",
              timeKnown: f.bunknown.value === "known" && !!f.btime.value, gender: f.bgender.value, demo: false };
  saveProfile(p); boot(p);
  document.getElementById("settings").open = false;
  window.scrollTo({ top: 0, behavior: "smooth" });
});
document.getElementById("resetBtn").addEventListener("click", () => {
  try { localStorage.removeItem(STORE); } catch (e) {}
  boot({ ...DEFAULT_PROFILE });
});

boot(loadProfile());
</script>
