<title>운의 시간표</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --paper:#E7E9E4; --sheet:#F6F7F3; --sunk:#DFE2DC;
    --ink:#171B1F; --ink-dim:#5C646B; --ink-faint:#8B939A;
    --rule:#C6CBC4; --rule-soft:#D8DCD5;
    --seal:#9C3B2E;
    --mok:#3C7A54; --hwa:#B4433A; --to:#9A6E2C; --geum:#63707B; --su:#2F5B7C;
    --wang:#2C6B4F; --swe:#8B5A6B;
    --serif:"Noto Serif KR",'Apple SD Gothic Neo',"Nanum Myeongjo",serif;
    --sans:"IBM Plex Sans KR",'Apple SD Gothic Neo',"Malgun Gothic",system-ui,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --maxw:1120px;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --paper:#12151A; --sheet:#1A1E24; --sunk:#0D1014;
      --ink:#E6E9E4; --ink-dim:#98A0A7; --ink-faint:#6C757D;
      --rule:#2D343B; --rule-soft:#232930;
      --seal:#D46A57;
      --mok:#5FA97C; --hwa:#DB7166; --to:#C79A4E; --geum:#9AA6B0; --su:#5E93BB;
      --wang:#5FA97C; --swe:#C08AA0;
    }
  }
  :root[data-theme="dark"]{
    --paper:#12151A; --sheet:#1A1E24; --sunk:#0D1014;
    --ink:#E6E9E4; --ink-dim:#98A0A7; --ink-faint:#6C757D;
    --rule:#2D343B; --rule-soft:#232930;
    --seal:#D46A57;
    --mok:#5FA97C; --hwa:#DB7166; --to:#C79A4E; --geum:#9AA6B0; --su:#5E93BB;
    --wang:#5FA97C; --swe:#C08AA0;
  }

  *{box-sizing:border-box}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:var(--sans); font-size:15px; line-height:1.72;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:var(--maxw); margin:0 auto; padding:0 20px 72px}
  h1,h2,h3{margin:0; font-family:var(--serif); font-weight:600; text-wrap:balance}
  p{margin:0 0 .85em}
  p:last-child{margin-bottom:0}
  .mono{font-family:var(--mono); font-variant-numeric:tabular-nums}
  .eyebrow{
    font-family:var(--mono); font-size:11px; letter-spacing:.14em;
    text-transform:uppercase; color:var(--ink-faint);
  }
  :focus-visible{outline:2px solid var(--seal); outline-offset:2px}

  /* ── 마스트헤드 ─────────────────────────────── */
  .masthead{
    border-bottom:1.5px solid var(--ink);
    padding:26px 0 14px; margin-bottom:0;
    display:flex; flex-wrap:wrap; align-items:flex-end; gap:18px 28px;
  }
  .brand{display:flex; align-items:baseline; gap:10px}
  .brand h1{font-size:27px; letter-spacing:-.01em; line-height:1.1}
  .brand .stamp{
    font-family:var(--serif); font-size:12px; color:var(--seal);
    border:1px solid var(--seal); border-radius:2px;
    padding:1px 4px 2px; line-height:1; letter-spacing:.08em;
  }
  .masthead .today{margin-left:auto; text-align:right; line-height:1.5}
  .masthead .today .d{font-family:var(--mono); font-size:12.5px; color:var(--ink-dim)}
  .masthead .today .gz{font-family:var(--serif); font-size:18px; font-weight:600}
  .masthead .today .gz em{font-style:normal; color:var(--ink-dim); font-size:13px; font-family:var(--sans)}

  .subline{
    display:flex; flex-wrap:wrap; gap:6px 20px; align-items:baseline;
    padding:9px 0; border-bottom:1px solid var(--rule);
    font-size:12.5px; color:var(--ink-dim);
  }
  .subline .k{font-family:var(--sans); font-weight:500; font-size:11px; letter-spacing:.05em; color:var(--ink-faint)}

  /* ── 오늘 ───────────────────────────────────── */
  .daily{
    border-bottom:1px solid var(--rule); padding:20px 0 22px;
    display:grid; grid-template-columns:132px minmax(0,1fr); gap:0 28px; align-items:start;
  }
  .daily .stampcol{border-right:1px solid var(--rule-soft); padding-right:20px}
  .daily .ilju{
    font-family:var(--serif); font-size:38px; font-weight:700; line-height:1.05;
  }
  .daily .ilju small{display:block; font-family:var(--sans); font-size:11px; font-weight:400; color:var(--ink-faint); letter-spacing:.04em; margin-top:2px}
  .daily .meta{margin-top:9px; font-size:11.5px; color:var(--ink-dim); line-height:1.65}
  .daily .meta b{color:var(--ink); font-weight:500}
  .daily h2{font-size:19px; line-height:1.35; margin-bottom:7px}
  .daily p{font-size:14.5px; line-height:1.78}
  .daily .act{
    margin-top:12px; padding-top:11px; border-top:1px dotted var(--rule-soft);
    font-size:13.5px; color:var(--ink-dim);
  }
  .daily .act b{color:var(--seal); font-weight:500}
  .daily .stale{
    margin-top:10px; font-size:11.5px; color:var(--ink-faint);
    border-left:2px solid var(--rule); padding-left:9px; line-height:1.6;
  }
  @media (max-width:640px){
    .daily{grid-template-columns:1fr; gap:16px}
    .daily .stampcol{border-right:none; border-bottom:1px solid var(--rule-soft); padding:0 0 14px}
  }

  /* ── 명식 그리드 (운 4칸 ‖ 원국 4칸) ────────── */
  .board{
    display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr);
    border-bottom:1px solid var(--rule);
  }
  .bank{ display:grid; grid-auto-rows:min-content; min-width:0 }
  .bank-un   { grid-template-columns:70px repeat(4,minmax(0,1fr)) }
  .bank-natal{ grid-template-columns:70px repeat(4,minmax(0,1fr)); border-left:2px solid var(--ink) }
  .bank-natal .rowlabels{ visibility:hidden }
  @media (max-width:860px){ .bank-natal .rowlabels{ visibility:visible } }
  .banktitle{
    grid-column:1/-1; font-size:11px; font-weight:500; letter-spacing:.06em;
    color:var(--ink-faint); padding:10px 0 6px;
  }
  .banktitle b{ color:var(--ink-dim); font-weight:500 }
  .rowlabels{ display:flex; flex-direction:column; border-right:1px solid var(--rule-soft) }
  .rowlabel{
    font-size:10.5px; letter-spacing:.04em; color:var(--ink-faint);
    display:flex; align-items:center; padding:0 8px 0 0;
  }
  .col{
    border-right:1px solid var(--rule-soft); padding:0 4px; min-width:0;
    display:flex; flex-direction:column; align-items:center; text-align:center;
  }
  .bank .col:last-child{ border-right:none }
  .bank-un .col       { background:var(--sunk) }
  .bank-un .col.fixed { background:var(--paper); border-left:1px dashed var(--rule) }
  .col.day            { box-shadow:inset 0 -3px 0 var(--rule) }
  /* 두 뱅크의 행 높이를 맞춘다 (subgrid 없이 정렬 보장) */
  .r-cap { min-height:44px } .r-gan{ min-height:74px } .r-zhi{ min-height:78px }
  .r-slot{ min-height:44px }
  .cap{
    padding:7px 0 6px; width:100%; font-size:11px; color:var(--ink-dim);
    border-bottom:1px solid var(--rule-soft); font-family:var(--sans);
    letter-spacing:.02em; line-height:1.35;
  }
  .cap b{ display:block; font-weight:500; color:var(--ink) }
  .cap .sp{ display:block; font-family:var(--mono); font-size:9.5px; color:var(--ink-faint) }
  .bank-un .cap b{ color:var(--seal) }
  .bank-un .col.fixed .cap b{ color:var(--seal) }
  .wbadge{
    display:inline-block; font-family:var(--mono); font-size:9px; line-height:1.5;
    border:1px solid var(--rule); border-radius:2px; padding:0 3px; color:var(--ink-faint);
  }
  .glyph{
    font-family:var(--serif); font-weight:700; line-height:1.02;
    font-size:clamp(24px,3.6vw,40px); padding:10px 0 2px;
  }
  .glyph .ko{display:block; font-family:var(--sans); font-size:10px; font-weight:400; color:var(--ink-faint); letter-spacing:.03em; line-height:1.4}
  .slot{
    width:100%; padding:4px 2px; font-size:11px; line-height:1.4;
    border-top:1px dotted var(--rule-soft); color:var(--ink-dim);
  }
  .slot b{display:block; font-weight:500; color:var(--ink); font-size:11.5px}
  .slot .alt{font-size:10px; color:var(--ink-faint)}
  .m木{color:var(--mok)} .m火{color:var(--hwa)} .m土{color:var(--to)}
  .m金{color:var(--geum)} .m水{color:var(--su)}

  @media (max-width:860px){          /* 4+4 접기 — 운 위, 원국 아래 */
    .board{ grid-template-columns:minmax(0,1fr) }
    .bank-natal{ border-left:none; border-top:2px solid var(--ink) }
    .glyph{ font-size:clamp(26px,6vw,38px) }
  }
  @media (max-width:520px){
    .bank-un, .bank-natal{ grid-template-columns:repeat(4,minmax(0,1fr)) }
    .rowlabel{ display:none }
    .r-gan{min-height:64px} .r-zhi{min-height:70px} .r-slot{min-height:50px}
  }

  /* ── 기간 눈금 ──────────────────────────────── */
  .scale{
    display:grid; grid-template-columns:repeat(6,1fr);
    border-bottom:1.5px solid var(--ink); margin-bottom:26px;
  }
  .scale button{
    appearance:none; background:none; border:none; cursor:pointer;
    border-right:1px solid var(--rule-soft); border-bottom:3px solid transparent;
    padding:11px 6px 9px; text-align:left; color:var(--ink-dim);
    font-family:var(--sans); font-size:13px; line-height:1.35;
    transition:background .14s, color .14s;
  }
  .scale button:last-child{border-right:none}
  .scale button .t{display:block; font-family:var(--mono); font-size:10px; letter-spacing:.12em; color:var(--ink-faint)}
  .scale button .n{font-weight:500; color:var(--ink)}
  .scale button:hover{background:var(--sheet)}
  .scale button[aria-selected="true"]{border-bottom-color:var(--seal); background:var(--sheet)}
  .scale button[aria-selected="true"] .n{color:var(--seal)}

  /* ── 판독 ───────────────────────────────────── */
  .reading{display:grid; grid-template-columns:minmax(0,340px) minmax(0,1fr); gap:0 40px}
  .ledger{border-right:1px solid var(--rule); padding-right:26px}
  .ldr-row{
    display:grid; grid-template-columns:62px 1fr; gap:10px;
    padding:9px 0; border-bottom:1px dotted var(--rule-soft);
    font-size:13px; align-items:baseline;
  }
  .ldr-row:last-child{border-bottom:none}
  .ldr-row dt{
    font-family:var(--sans); font-weight:500; font-size:11px; letter-spacing:.06em;
    color:var(--ink-faint); padding-top:3px;
  }
  .ldr-row dd{margin:0}
  .ldr-row dd .sub{display:block; color:var(--ink-dim); font-size:12px; line-height:1.5}
  dl{margin:0}

  .tag{
    display:inline-block; font-size:11.5px; line-height:1.5;
    padding:1px 7px 2px; margin:0 4px 4px 0;
    border:1px solid var(--rule); border-radius:2px; color:var(--ink-dim);
    font-family:var(--mono);
  }
  .tag.hit{border-color:var(--seal); color:var(--seal)}
  .tag.wang{border-color:var(--wang); color:var(--wang)}
  .tag.swe{border-color:var(--swe); color:var(--swe)}

  .prose h2{
    font-size:23px; line-height:1.3; margin-bottom:4px; letter-spacing:-.01em;
  }
  .prose .lede{
    font-family:var(--serif); font-size:15.5px; color:var(--ink-dim);
    margin-bottom:20px; padding-bottom:16px; border-bottom:1px solid var(--rule-soft);
  }
  .prose h3{
    font-size:11.5px; font-family:var(--sans); font-weight:500; letter-spacing:.09em;
    color:var(--ink-faint);
    margin:24px 0 8px; padding-bottom:5px; border-bottom:1px solid var(--rule-soft);
  }
  .prose h3:first-of-type{margin-top:0}
  .verdict{
    display:grid; grid-template-columns:1fr 1fr; gap:0;
    border:1px solid var(--rule); margin-top:24px;
  }
  .verdict div{padding:13px 16px}
  .verdict div+div{border-left:1px solid var(--rule)}
  .verdict .lab{
    font-family:var(--sans); font-weight:500; font-size:11px; letter-spacing:.07em;
    color:var(--ink-faint); display:block; margin-bottom:4px;
  }
  .verdict .do .lab{color:var(--seal)}
  .verdict strong{font-weight:500; font-size:14px; line-height:1.5}

  /* 초점 자리 */
  .focus{ margin:6px 0 0 }
  .fs{ padding:9px 0; border-bottom:1px dotted var(--rule-soft) }
  .fs:last-child{ border-bottom:none }
  .fs .hd{ display:flex; align-items:baseline; gap:8px; font-size:13.5px; margin-bottom:5px }
  .fs .hd b{ font-family:var(--serif); font-size:15px; font-weight:600 }
  .fs .hd .ar{ color:var(--ink-dim); font-size:12px }
  .fs .hd .sc{ margin-left:auto; font-family:var(--mono); font-size:11px; color:var(--ink-faint) }
  .fsbar{ display:flex; height:9px; background:var(--sunk); overflow:hidden }
  .fsbar i{ display:block; height:100% }
  .fsbar i.l-dw { background:var(--su) }
  .fsbar i.l-se { background:var(--mok) }
  .fsbar i.l-wol{ background:var(--to) }
  .fsbar i.l-il { background:var(--hwa) }
  .fs .lg{ margin-top:5px; font-size:11.5px; color:var(--ink-dim); line-height:1.55 }
  .fs .lg em{ font-style:normal; font-family:var(--mono); font-size:10.5px; color:var(--ink-faint) }
  .stackbox{ border:1px solid var(--rule); padding:14px 16px; margin-top:16px }
  .stackbox p{ font-size:13.5px; line-height:1.72; margin-bottom:.7em }
  .stackbox p:last-child{ margin-bottom:0 }
  .layerlines{ margin:0 }
  .ll{ display:grid; grid-template-columns:62px minmax(0,1fr); gap:12px;
       padding:9px 0; border-bottom:1px dotted var(--rule-soft); font-size:13.5px; line-height:1.7 }
  .ll:last-child{ border-bottom:none }
  .ll .lk{ font-family:var(--mono); font-size:10.5px; color:var(--ink-faint); padding-top:4px }
  .ll .lk b{ display:block; font-family:var(--sans); font-size:12px; color:var(--ink); font-weight:500 }

  /* 관계 목록 */
  .rels{list-style:none; margin:0; padding:0}
  .rels li{
    display:grid; grid-template-columns:78px 1fr; gap:12px;
    padding:7px 0; border-bottom:1px dotted var(--rule-soft); font-size:13.5px;
  }
  .rels li:last-child{border-bottom:none}
  .rels .who{font-family:var(--sans); font-size:11.5px; color:var(--ink-faint); padding-top:3px}
  .rels .what b{font-weight:500}
  .rels .what span{color:var(--ink-dim)}

  /* 주간 스트립 */
  .week{margin-top:30px; border-top:1px solid var(--rule); padding-top:0}
  .weekhead{
    font-size:11.5px; font-family:var(--sans); font-weight:500; letter-spacing:.09em;
    color:var(--ink-faint); padding:12px 0 10px;
  }
  .weekhead span{font-weight:400; letter-spacing:0}
  .week .days{display:grid; grid-template-columns:repeat(7,1fr); border-bottom:1px solid var(--rule)}
  .week .day{
    border-right:1px solid var(--rule-soft); padding:10px 6px 12px; text-align:center;
    display:flex; flex-direction:column; gap:3px; min-height:112px;
  }
  .week .day:last-child{border-right:none}
  .week .day.today{background:var(--sheet)}
  .week .day.marked{background:var(--sunk)}
  .week .day .dow{font-family:var(--mono); font-size:10px; letter-spacing:.08em; color:var(--ink-faint)}
  .week .day .dt{font-family:var(--mono); font-size:12px; color:var(--ink-dim)}
  .week .day .gz{font-family:var(--serif); font-size:21px; font-weight:600; line-height:1.15}
  .week .day .mk{font-size:11px; line-height:1.35; color:var(--seal)}
  .week .day .s12{font-size:10.5px; color:var(--ink-faint)}
  .week .day.today .dt{color:var(--seal); font-weight:500}

  .weeklede{
    font-family:var(--serif); font-size:14.5px; line-height:1.75; color:var(--ink-dim);
    padding:2px 0 14px;
  }
  .weeklede b{ color:var(--ink); font-weight:600 }
  .weeklines{ border-bottom:1px solid var(--rule) }
  .wl{
    display:grid; grid-template-columns:104px minmax(0,1fr); gap:16px;
    padding:9px 0; border-bottom:1px dotted var(--rule-soft); font-size:13.5px; line-height:1.7;
  }
  .wl:last-child{ border-bottom:none }
  .wl.today{ background:var(--sheet) }
  .wl .k{ font-family:var(--mono); font-size:11px; color:var(--ink-faint); padding-top:3px }
  .wl .k b{ font-family:var(--serif); font-size:15px; font-weight:600; margin-left:5px }
  .wl.today .k{ color:var(--seal) }
  .wl.marked .t::before{ content:"▸ "; color:var(--seal) }
  @media (max-width:520px){ .wl{ grid-template-columns:1fr; gap:2px } }

  /* ── 하단 명식 상세 ─────────────────────────── */
  .foot{margin-top:44px; border-top:1.5px solid var(--ink); padding-top:0}
  .panels{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:0}
  .panel{border-right:1px solid var(--rule); padding:18px 24px 20px}
  .panel:first-child{padding-left:0}
  .panel:last-child{border-right:none; padding-right:0}
  .panel h3{
    font-family:var(--sans); font-size:11.5px; font-weight:500; letter-spacing:.09em;
    color:var(--ink-faint); margin-bottom:12px;
  }
  .bars{display:flex; flex-direction:column; gap:7px}
  .bar{display:grid; grid-template-columns:36px 1fr 22px; gap:8px; align-items:center; font-size:12.5px}
  .bar .nm{font-family:var(--serif); font-weight:600}
  .bar .tr{height:7px; background:var(--sunk); position:relative; overflow:hidden}
  .bar .fl{position:absolute; inset:0 auto 0 0; height:100%}
  .bar .ct{font-family:var(--mono); font-size:11.5px; color:var(--ink-dim); text-align:right}
  .b木{background:var(--mok)} .b火{background:var(--hwa)} .b土{background:var(--to)}
  .b金{background:var(--geum)} .b水{background:var(--su)}

  .daewoon{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(58px,1fr));
    border:1px solid var(--rule-soft); border-width:1px 0 0 1px;
  }
  .dw{padding:8px 5px; text-align:center; border:1px solid var(--rule-soft); border-width:0 1px 1px 0}
  .dw.on{background:var(--sunk); box-shadow:inset 0 -3px 0 var(--seal)}
  .dw .a{font-family:var(--mono); font-size:10.5px; color:var(--ink-faint)}
  .dw .g{font-family:var(--serif); font-size:18px; font-weight:600; line-height:1.2}

  .kv{display:grid; grid-template-columns:auto 1fr; gap:4px 12px; font-size:12.5px}
  .kv dt{font-family:var(--sans); font-weight:500; font-size:11px; letter-spacing:.04em; color:var(--ink-faint); padding-top:3px}
  .kv dd{margin:0; color:var(--ink-dim)}
  .kv dd b{color:var(--ink); font-weight:500}

  /* ── 설정 ───────────────────────────────────── */
  .settings{margin-top:36px; border-top:1px solid var(--rule); padding-top:16px}
  .settings summary{
    cursor:pointer; font-family:var(--sans); font-weight:500; font-size:12.5px;
    letter-spacing:.03em; color:var(--ink-dim); list-style:none;
  }
  .settings summary::-webkit-details-marker{display:none}
  .settings summary::before{content:"⌖ "; color:var(--seal)}
  .settings summary:hover{color:var(--ink)}
  .form{
    display:flex; flex-wrap:wrap; gap:14px 20px; align-items:flex-end;
    margin-top:16px; padding:18px 20px; background:var(--sheet); border:1px solid var(--rule-soft);
  }
  .field{display:flex; flex-direction:column; gap:4px}
  .field label{font-family:var(--sans); font-weight:500; font-size:11px; letter-spacing:.05em; color:var(--ink-faint)}
  .field input,.field select{
    font-family:var(--mono); font-size:13.5px; padding:6px 9px;
    border:1px solid var(--rule); background:var(--paper); color:var(--ink);
    border-radius:2px; min-width:0;
  }
  .form button{
    font-family:var(--sans); font-size:13.5px; font-weight:500; cursor:pointer;
    padding:7px 18px; border:1px solid var(--seal); background:var(--seal); color:#fff;
    border-radius:2px;
  }
  .form button.ghost{background:none; color:var(--ink-dim); border-color:var(--rule)}
  .form .note{flex:1 1 100%; font-size:12px; color:var(--ink-faint); line-height:1.6}

  .colophon{
    margin-top:34px; padding-top:14px; border-top:1px solid var(--rule-soft);
    font-size:11.5px; line-height:1.75; color:var(--ink-faint);
  }

function buildNatal(profile) {
  const [Y, M, D] = profile.date.split("-").map(Number);
  const known = profile.timeKnown;
  const [hh, mi] = (known ? profile.time : "12:00").split(":").map(Number);
  const stdMin = kmin(new Date(Date.UTC(Y, M - 1, D, hh, mi)));
  const corrected = stdMin + (profile.solar === false ? 0 : -32);   // 진태양시 보정
  const slot = jieSlot(corrected);
  const yp = yearPillar(slot.jieYear);
  const mz = MONTH_ZHI[slot.k];
  const mp = monthGan(yp[0], mz) + mz;
  const dp = dayPillar(corrected);
  const hp = known ? hourPillar(dp[0], corrected) : null;
  const pillars = [yp, mp, dp, hp];
  const zhis = [yp[1], mp[1], dp[1], hp ? hp[1] : null];
  const dayGan = dp[0];

  // 오행 분포
  const cnt = { 木: 0, 火: 0, 土: 0, 金: 0, 水: 0 };
  pillars.forEach(p => { if (!p) return; cnt[OG[GAN.indexOf(p[0])]]++; cnt[OZ[ZHI.indexOf(p[1])]]++; });

  // 일간 통근
  const roots = [];
  ["년", "월", "일", "시"].forEach((lab, i) => {
    if (!zhis[i]) return;
    if (JANGGAN[zhis[i]].split("").some(g => OG[GAN.indexOf(g)] === OG[GAN.indexOf(dayGan)])) roots.push(lab + "지 " + zhis[i]);
  });

  // 월지 투출 → 격 1차 후보
  const tuchul = JANGGAN[mz].split("").filter(g => [yp[0], mp[0], hp ? hp[0] : ""].includes(g));
  const gyeok = tuchul.length
    ? tuchul.map(g => `${g}(${sipsin(dayGan, g)})`).join("·") + " 투출"
    : `미투출 → 본기 ${JANGGAN[mz].slice(-1)}(${sipsin(dayGan, JANGGAN[mz].slice(-1))})`;

  // 원국 신살
  const sinsal = [];
  const push = (n, g, v) => sinsal.push({ n, g, v });
  const posOf = z => ["년", "월", "일", "시"].filter((_, i) => zhis[i] === z).map(l => l + "지");
  if (YANGIN[dayGan] && zhis.includes(YANGIN[dayGan])) push("양인", "A", posOf(YANGIN[dayGan]).join("·") + " " + YANGIN[dayGan]);
  if (zhis.includes(MUNCHANG[dayGan])) push("문창귀인", "B", posOf(MUNCHANG[dayGan]).join("·") + " " + MUNCHANG[dayGan]);
  if (zhis.includes(HAKDANG[dayGan])) push("학당귀인", "B", posOf(HAKDANG[dayGan]).join("·") + " " + HAKDANG[dayGan]);
  const ce = zhis.filter(z => z && CHEONEUL[dayGan].includes(z));
  if (ce.length) push("천을귀인", "B", ce.join("·") + " — 결과가 아니라 통로");
  const gm = gongmang(dp);
  const gmHit = zhis.filter(z => z && gm.includes(z));
  push("공망", "A~B", `공망지 ${gm}` + (gmHit.length ? ` — ${gmHit.map(z => posOf(z)[0] + " " + z).join("·")}` : " — 원국에 없음"));
  const bh = pillars.filter(p => p && BAEKHO.includes(p));
  if (bh.length) push("백호대살", "B", bh.join("·"));
  const kg = pillars.filter(p => p && GWAEGANG.includes(p));
  if (kg.length) push("괴강", "B", kg.join("·"));
  if (zhis.includes(GEUMYEO[dayGan])) push("금여", "C", GEUMYEO[dayGan]);
  if (zhis.includes(HONGYEOM[dayGan])) push("홍염살", "C~D", HONGYEOM[dayGan] + " — 근거가 얇은 항목");
  if (zhis.includes("戌") && zhis.includes("亥")) push("천라", "C", "戌亥");
  if (zhis.includes("辰") && zhis.includes("巳")) push("지망", "C", "辰巳");

  // 원국 내부 관계
  const inner = [];
  const labs = ["년", "월", "일", "시"];
  for (let i = 0; i < 4; i++) for (let j = i + 1; j < 4; j++) {
    if (!zhis[i] || !zhis[j]) continue;
    const r = zhiRel(zhis[i], zhis[j]);
    if (r.length) inner.push({ a: labs[i] + "지" + zhis[i], b: labs[j] + "지" + zhis[j], r });
  }

  // 대운
  const dw = daewoon(profile, yp[0], mp, corrected, slot);

  return { profile, pillars, zhis, dayGan, yearZhi: yp[1], dayZhi: dp[1],
           slot, cnt, roots, gyeok, sinsal, inner, dw, gongmangZhi: gm,
           guk: gukOf(yp[1]), gukDay: gukOf(dp[1]), timeKnown: known, birthMin: corrected };
}

function daewoon(profile, yearGan, monthGz, birthMin, slot) {
  const yangYear = !YIN(GAN.indexOf(yearGan));
  const forward = (yangYear && profile.gender === "M") || (!yangYear && profile.gender === "F");
  const days = forward ? (slot.end - birthMin) / 1440 : (birthMin - slot.start) / 1440;
  let startAge = Math.floor(days / 3 + 0.5); if (startAge === 0) startAge = 1;
  const m60 = gzIndex(monthGz);
  const list = [];
  const birthYear = kd(birthMin).getUTCFullYear();
  for (let n = 1; n <= 9; n++) {
    list.push({ gz: gz(forward ? m60 + n : m60 - n), age: startAge + 10 * (n - 1), year: birthYear + startAge + 10 * (n - 1) });
  }
  return { forward, startAge, list, rule: `연간 ${yearGan}(${yangYear ? "양" : "음"}간) · ${profile.gender === "M" ? "남명" : "여명"} → ${forward ? "순행" : "역행"}` };
}

/* ══ 기간 판독 ══════════════════════════════════ */
function relationsTo(natal, targetZhi) {
  const labs = ["년", "월", "일", "시"], out = [];
  for (let i = 0; i < 4; i++) {
    if (!natal.zhis[i]) continue;
    const r = zhiRel(natal.zhis[i], targetZhi);
    if (r.length) out.push({ pos: labs[i], zhi: natal.zhis[i], rel: r,
                             weight: Math.max(...r.map(x => (REL_INFO[x] || { w: 1 }).w)) });
  }
  return out.sort((a, b) => b.weight - a.weight);
}

function readPeriod(natal, ganzhi, startMin, endMin, meta) {
  const g = ganzhi[0], z = ganzhi[1];

  else if (SHENG[gO] === zO) gzRel = "천간이 지지를 생한다 — 힘이 아래로 빠진다";
  else if (KE[gO] === zO) gzRel = "천간이 지지를 극한다(개두) — 하려는 것과 실제가 어긋난다";
  else if (KE[zO] === gO) gzRel = "지지가 천간을 극한다(절각) — 뜻은 있으나 발이 묶인다";
  else gzRel = "천간과 지지가 같은 기운 — 색이 진하고 단순하다";

  const s12y = sinsal12(natal.yearZhi, z);
  const s12d = sinsal12(natal.dayZhi, z);
  const unY = unseong(natal.dayGan, z, "eum");
  const unYang = unseong(natal.dayGan, z, "yang");
  const rels = relationsTo(natal, z);

  // 십신 인종
  const incho = GAN.split("").map(x => ({ s: sipsin(natal.dayGan, x), gan: x, un: unseong(x, z, "eum") }));
  const alive = incho.filter(x => UN_POWER[x.un] >= 2);
  const down  = incho.filter(x => UN_POWER[x.un] <= -1);
  const groups = a => [...new Set(a.map(x => SIPSIN_GROUP[x.s]))];

  return { ganzhi, g, z, gO, zO, gzRel, s12y, s12d, unY, unYang, rels,
           incho, alive, down, aliveG: groups(alive), downG: groups(down),
           startMin, endMin, meta,
           gongmang: natal.gongmangZhi.includes(z) };
}

/* ══ 층위 중첩 (references/31 §6) ═══════════════
   ⚠️ 이 블록은 반드시 "렌더" 마커 위에 둔다 — 매일 아침 예약 작업이
      스크립트 시작부터 그 마커까지를 잘라 엔진으로 쓴다.                   */

const LAYER_DEF = [                                   // 비중: references/28_scoring.md §1
  { key: "dw",  name: "대운", w: 25, role: "배경", hint: "10년간 깔려 있는 판" },
  { key: "se",  name: "세운", w: 12, role: "주제", hint: "올해의 화두" },
  { key: "wol", name: "월운", w: 5,  role: "시점", hint: "언제 불거지는가" },
  { key: "il",  name: "일운", w: 3,  role: "촉발", hint: "그날의 방아쇠" }
];
const NATAL_W = 55;
const GUK_ELEM  = { "申子辰": "水", "亥卯未": "木", "寅午戌": "火", "巳酉丑": "金" };
const BANG_ELEM = { "寅卯辰": "木", "巳午未": "火", "申酉戌": "金", "亥子丑": "水" };
const BANG_NAME = { "寅卯辰": "동방 목국", "巳午未": "남방 화국", "申酉戌": "서방 금국", "亥子丑": "북방 수국" };
const GAN_CHUNG = ["甲庚", "乙辛", "丙壬", "丁癸"];    // 22_hapchung_shinsal.md §1-4. 戊己는 충 없음
const isGanChung = (a, b) => GAN_CHUNG.some(p => p.includes(a) && p.includes(b) && a !== b);

/** 천간·지지의 응집 — 개두·절각 판정 (readPeriod에서 추출한 공용 헬퍼) */
function ganZhiCohesion(g, z) {
  const gO = OG[GAN.indexOf(g)], zO = OZ[ZHI.indexOf(z)];
  let t;
  if (SHENG[zO] === gO)      t = "지지가 천간을 생한다 — 뿌리가 받쳐준다";
  else if (SHENG[gO] === zO) t = "천간이 지지를 생한다 — 힘이 아래로 빠진다";
  else if (KE[gO] === zO)    t = "천간이 지지를 극한다(개두) — 하려는 것과 실제가 어긋난다";
  else if (KE[zO] === gO)    t = "지지가 천간을 극한다(절각) — 뜻은 있으나 발이 묶인다";
  else                       t = "천간과 지지가 같은 기운 — 색이 진하고 단순하다";
  return { gO, zO, t };
}

/** 해당 절기년에 유효한 대운 (render()의 기존 판정식과 동일) */
function daewoonAt(natal, jieYear) {
  let cur = null, idx = -1;
  natal.dw.list.forEach((d, i) => { if (jieYear >= d.year) { cur = d; idx = i; } });
  return cur ? { ...cur, idx } : null;
}

/** 4층 간지 조립. 대운·세운·월운은 anchorMin 기준, 일운은 언제나 오늘 (31 §6-2) */
function resolveLayers(natal, anchorMin, todayMin) {
  const slot = jieSlot(anchorMin), jy = slot.jieYear;
  const se = yearPillar(jy);
  const mz = MONTH_ZHI[slot.k];
  const dw = daewoonAt(natal, jy);
  const raw = {
    dw:  dw ? { gz: dw.gz, span: `${dw.age}세 · ${dw.year}~${dw.year + 9}` } : null,
    se:  { gz: se, span: `${jy} 입춘 ~ ${jy + 1} 입춘 직전` },
    wol: { gz: monthGan(se[0], mz) + mz, span: `${JIE[slot.k]} ~ ${JIE[(slot.k + 1) % 12]} 직전` },
    il:  { gz: dayPillar(todayMin), span: "오늘" }
  };
  return LAYER_DEF.map(L => {
    const r = raw[L.key];
    if (!r) return { ...L, gz: null, span: "대운 전", fixed: false, empty: true };
    return { ...L, gz: r.gz, g: r.gz[0], z: r.gz[1], span: r.span,
             fixed: L.key === "il", empty: false };
  });
}

/** 삼합·방합 완성 — 원국 + 운. 출처 층위를 반드시 기록한다 (31 §6-4) */
function hapComplete(natal, layers) {
  const natalAt = {}, unAt = {};
  ["년", "월", "일", "시"].forEach((l, i) => {
    const z = natal.zhis[i]; if (!z) return;
    (natalAt[z] = natalAt[z] || []).push(l + "지");
  });
  layers.forEach(L => { if (!L.empty) (unAt[L.z] = unAt[L.z] || []).push(L.name); });
  const all = z => (natalAt[z] || []).concat(unAt[z] || []);
  const out = [];
  const scan = (sets, type, elem, nm) => sets.forEach(set => {
    const zs = set.split("");
    if (!zs.every(z => all(z).length)) return;
    const natalCount = zs.filter(z => natalAt[z]).length;
    const unOnly = zs.filter(z => !natalAt[z] && unAt[z]);
    if (!unOnly.length) return;                       // 원국만으로 이미 완성 — 운이 만든 것 아님
    const unW = [...new Set(zs.flatMap(z => unAt[z] || []))]
      .reduce((a, n) => a + (LAYER_DEF.find(L => L.name === n) || { w: 0 }).w, 0);
    // 완성을 깰 충이 판에 있는가 (충산합해)
    const fragile = zs.find(z => zs.concat(Object.keys(natalAt), Object.keys(unAt))
      .some(o => CHUNG.includes([z, o].sort().join(""))));
    out.push({
      type, set, elem: elem[set], name: nm ? nm[set] : GUK_NAME[set],
      parts: zs.map(z => ({ zhi: z, from: all(z).join("·"), unOnly: !natalAt[z] })),
      natalCount, unCount: zs.length - natalCount,
      grade: natalCount >= 2 ? "A" : natalCount === 1 ? "B" : "C",
      w: unW + natalCount * (NATAL_W / 4),
      fragile: fragile || null
    });
  });
  scan(SAMHAP, "삼합", GUK_ELEM, null);
  scan(BANGHAP, "방합", BANG_ELEM, BANG_NAME);
  return out.sort((a, b) => b.w - a.w);
}

/** 층위 간 관계 6쌍 (31 §6-3) */
function crossLayer(layers) {
  const out = [];
  for (let i = 0; i < layers.length; i++) for (let j = i + 1; j < layers.length; j++) {
    const A = layers[i], B = layers[j];
    if (A.empty || B.empty) continue;
    const rel = zhiRel(A.z, B.z);
    const gan = A.g === B.g ? "천간 동일" : isGanChung(A.g, B.g) ? "천간충" : null;
    if (!rel.length && !gan) continue;
    out.push({ a: A.key, b: B.key, na: A.name, nb: B.name, za: A.z, zb: B.z, gan, rel,
               w: rel.length ? Math.max(...rel.map(x => (REL_INFO[x] || { w: 1 }).w)) : 2,
               pairW: A.w + B.w,
               info: rel.length ? (REL_INFO[rel[0]] || { t: "" }).t : "" });
  }
  return out.sort((a, b) => b.pairW - a.pairW || b.w - a.w);
}

/** 복음·반음 — 간지 단위 (31 §6-6) */
function bokeumBaneum(natal, layers) {
  const bok = [], ban = [];
  const labs = ["년", "월", "일", "시"];
  layers.forEach(L => {
    if (L.empty) return;
    natal.pillars.forEach((pgz, i) => {
      if (!pgz) return;
      if (pgz === L.gz) bok.push({ scope: "원국", key: L.key, name: L.name, gz: L.gz, target: labs[i] + "주" });
      else if (isGanChung(pgz[0], L.g) && CHUNG.includes([pgz[1], L.z].sort().join("")))
        ban.push({ scope: "원국", key: L.key, name: L.name, gz: L.gz, target: labs[i] + "주", natalGz: pgz });
    });
  });
  for (let i = 0; i < layers.length; i++) for (let j = i + 1; j < layers.length; j++) {
    const A = layers[i], B = layers[j];
    if (A.empty || B.empty) continue;
    if (A.gz === B.gz) bok.push({ scope: "운", key: A.key, name: A.name, gz: A.gz, target: B.name });
    else if (isGanChung(A.g, B.g) && CHUNG.includes([A.z, B.z].sort().join("")))
      ban.push({ scope: "운", key: A.key, name: A.name, gz: A.gz, target: B.name, natalGz: B.gz });
  }
  return { bok, ban };
}

/** 초점 자리 — 한 원국 궁에 2개 이상 층위가 걸릴 때 (31 §6-5) */
function focusSpots(natal, layers) {
  const by = {};
  layers.forEach(L => {
    if (L.empty) return;
    relationsTo(natal, L.z).forEach(r => {
      const f = by[r.pos] = by[r.pos] || { pos: r.pos, zhi: r.zhi, hits: [] };
      f.hits.push({ key: L.key, name: L.name, rel: r.rel, relW: r.weight, layerW: L.w, sub: r.weight * L.w });
    });
  });
  const list = Object.values(by).map(f => ({
    ...f, area: GUNG[f.pos].area, short: GUNG[f.pos].short,
    layerCount: f.hits.length,
    score: f.hits.reduce((a, h) => a + h.sub, 0),
    volatile: f.hits.filter(h => h.key !== "dw").reduce((a, h) => a + h.sub, 0)
  })).sort((a, b) => b.score - a.score);
  const tot = list.reduce((a, f) => a + f.score, 0) || 1;
  list.forEach(f => { f.share = f.score / tot; });
  return list;
}

/** 4층 결합 판독 — 위를 묶는다 */
function readStack(natal, layers) {
  const perLayer = layers.map(L => {
    if (L.empty) return { ...L };
    const coh = ganZhiCohesion(L.g, L.z);
    const rels = relationsTo(natal, L.z);
    return { ...L, ...coh, gzRel: coh.t,
      sipsinG: sipsin(natal.dayGan, L.g),
      sipsinZ: sipsin(natal.dayGan, JANGGAN[L.z].slice(-1)),
      s12y: sinsal12(natal.yearZhi, L.z), s12d: sinsal12(natal.dayZhi, L.z),
      unY: unseong(natal.dayGan, L.z, "eum"), unYang: unseong(natal.dayGan, L.z, "yang"),
      rels, relW: rels.reduce((a, r) => a + r.weight, 0),
      gongmang: natal.gongmangZhi.includes(L.z) };
  });
  const all = focusSpots(natal, layers);
  const bb = bokeumBaneum(natal, layers);
  return {
    layers, perLayer,
    allSpots: all,
    focus: all.filter(f => f.layerCount >= 2),
    cross: crossLayer(layers),
    hap: hapComplete(natal, layers),
    bokeum: bb.bok, baneum: bb.ban,
    gongmangHits: perLayer.filter(L => !L.empty && L.gongmang).map(L => ({ key: L.key, name: L.name, z: L.z }))
  };
}

/* ── 서술 조립 (사전 기반. 고정 문구를 새로 쓰지 않는다) ── */

const clause = t => String(t || "").split(/[.—]/)[0].trim();

/* 한글 조사 — 한자는 훈음으로 받침을 판정한다 */
const koOf = ch => { const i = ZHI.indexOf(ch); if (i >= 0) return ZHI_KO[i];
                     const j = GAN.indexOf(ch); return j >= 0 ? GAN_KO[j] : ch; };
function hasJong(word) {
  const k = koOf(String(word).slice(-1));
  const c = k.charCodeAt(k.length - 1) - 0xAC00;
  return c >= 0 && c < 11172 && c % 28 !== 0;
}
/** josa("申","은","는") → "申은" */
const josa = (w, a, b) => w + (hasJong(w) ? a : b);
/** 받침 있으면 "으로", 없거나 ㄹ이면 "로" */
function ro(w) {
  const k = koOf(String(w).slice(-1));
  const c = k.charCodeAt(k.length - 1) - 0xAC00;
  if (c < 0 || c >= 11172) return w + "로";
  const j = c % 28;
  return w + (j === 0 || j === 8 ? "로" : "으로");
}

function layerLine(natal, st, key) {
  const L = st.perLayer.find(x => x.key === key);
  if (!L || L.empty) return `${LAYER_DEF.find(x => x.key === key).name}은 아직 시작 전입니다.`;
  // 위 층위와 간지가 같으면 되풀이해 적지 않는다
  const twin = st.perLayer.find(x => !x.empty && x.key !== key && x.gz === L.gz && x.w > L.w);
  if (twin) return `<b>${L.name} ${L.gz}</b> — ${L.role}. ${twin.name}과 간지가 같습니다(복음). ` +
    `${twin.role}에 깔린 것이 ${L.role} 자리에서 한 번 더 눌립니다 — 새 일이 아니라 하던 일이 진해지는 결입니다.`;
  const top = L.rels[0];
  const sd = SINSAL_DESC[L.s12y];
  let t = `<b>${L.name} ${L.gz}</b> — ${L.role}. ${natal.dayGan} 일간에게 ${josa(L.z, "은", "는")} <b>${L.unY}</b>, ` +
          `년지 기준 <b>${L.s12y}</b>(${sd.tag})입니다. `;
  t += top
    ? `${top.pos}지 ${top.zhi}에 ${ro(top.rel.join("·"))} 걸려 ${GUNG[top.pos].short} 쪽이 움직이기 쉽습니다.`
    : `원국 지지와 직접 걸리는 자리는 없어, ${clause(UN_DESC[L.unY])} 정도의 온도로 지나갑니다.`;
  if (L.gongmang) t += ` ${josa(L.z, "은", "는")} 공망지라 뜻만큼 실체가 잡히지 않을 수 있습니다.`;
  return t;
}

function stackProse(natal, st) {
  const bits = [];
  const f = st.focus[0];
  if (f) {
    const names = f.hits.map(h => h.name).join("·");
    bits.push(`네 층위 중 <b>${names}</b>이 한꺼번에 <b>${f.pos}지 ${f.zhi}</b>에 걸립니다. ` +
      `${f.area} 쪽이 이 기간의 초점입니다. ${f.hits.map(h => `${h.name} ${h.rel[0]}`).join(", ")} — 이것들이 한 자리에 겹쳐 만드는 결입니다.`);
  } else {
    bits.push("두 층위 이상이 한 자리에 겹치는 곳이 없습니다. 밖에서 밀고 들어오는 일보다 각 층위가 따로 굴러가는 구간입니다.");
  }
  const h = st.hap[0];
  if (h) {
    const unZ = h.parts.filter(p => p.unOnly).map(p => p.zhi).join("·");
    bits.push(`원국과 운의 글자가 합쳐져 <b>${h.set} ${h.name}</b> ${h.type}이 섭니다 — ${h.parts.map(p => `${p.zhi} ${p.from}`).join(" / ")}. ` +
      `${josa(unZ, "은", "는")} 운에서 온 글자라, 그 운이 지나면 이 국은 풀립니다.` + (h.fragile ? ` 다만 ${josa(h.fragile, "을", "를")} 충하는 글자가 판에 있어 완전히 굳지는 않습니다.` : ""));
  }
  const bk = st.bokeum[0];
  if (bk) bits.push(bk.scope === "운"
    ? `<b>${bk.name}과 ${bk.target}의 간지가 ${bk.gz}로 같습니다(복음)</b> — 새 일이 아니라 하던 일이 두 배로 진해집니다.`
    : `<b>${bk.name} ${bk.gz}가 ${bk.target}와 같습니다(복음)</b> — 그 자리의 성질이 되풀이됩니다.`);
  const bn = st.baneum[0];
  if (bn) bits.push(`<b>${bn.name} ${bn.gz}가 ${bn.target}와 반음</b>입니다 — 그 영역이 정면으로 뒤집히는 결. 다만 반음은 이름이 험한 만큼 과대해석을 경계합니다.`);
  const c = st.cross[0];
  if (c && c.rel.length) bits.push(`운끼리는 ${c.na} ${c.za}와 ${c.nb} ${c.zb}가 <b>${c.rel.join("·")}</b>입니다 — ${c.info}`);
  if (st.gongmangHits.length >= 2)
    bits.push(`덧붙여 ${st.gongmangHits.map(g => `${g.name} ${g.z}`).join("·")}가 모두 일주 기준 공망지입니다. 뜻은 서는데 손에 안 잡히는 느낌이 겹칩니다.`);
  return bits;
}

/** 주간 하루 한 줄. 표시일은 관계를 근거로, 나머지는 배치 정보까지만 (31 §4⑤⑥) */
function dayLine(natal, dgz, marked) {
  const z = dgz[1];
  const s12 = sinsal12(natal.yearZhi, z), un = unseong(natal.dayGan, z, "eum");
  const top = relationsTo(natal, z)[0];
  const sd = SINSAL_DESC[s12];
  if (marked && top) {
    const info = REL_INFO[top.rel[0]] || { t: "" };
    return `${top.pos}지 ${top.zhi}에 <b>${top.rel.join("·")}</b> — ${clause(info.t)}. ` +
           `${GUNG[top.pos].short} 쪽으로 힘이 실리기 쉬운 날입니다. (${un} · ${s12})`;
  }
  return `${sd.tag}. ${clause(UN_DESC[un])} — ${clause(sd.act)}기 무난한 날입니다. (${un} · ${s12})`;
}

function weekLede(natal, p) {
  const marks = p.days.filter(d => d.marked);
  const mz = p.monthGz[1];
  const bits = [
    `배경은 <b>${p.monthGz}</b>월입니다. ${ZHI_DESC[mz].theme}`,
    marks.length
      ? `이번 주에 원국과 가장 세게 걸리는 날은 ${marks.map(d => `${fmtMD(d.min)}(${d.gz})`).join(", ")}입니다.`
      : `7일 중 원국에 특별히 세게 걸리는 날은 없습니다. 고르게 지나가는 주입니다.`,
    `일운의 비중은 3입니다. 아래 7줄은 사건 예측이 아니라 <b>무엇을 어느 날에 두면 좋은가</b>에 대한 배치 참고입니다.`
  ];
  return bits;
}

/* ══ 음력 (무중치윤법 — 파이썬에서 삭 실계산 후 확정한 표) ═══
   lunDelta : 음력월 길이(29/30)를 base36 한 글자씩
   lunLabel : (월-1)*2 + 윤달여부 를 base36 한 글자씩
   검증: 설날 10개 연도·추석 4개 연도가 한국천문연구원 공표일과 일치,
        윤달(2020 윤4·2023 윤2·2025 윤6·2028 윤5) 일치.

function johuAxis(dayGan, monthZhi, gan, zhi, excess) {

    if (hg.includes(g)) { why.push(`${g} 조후 희신`); return 0.4; }
    if (xg.includes(g)) { if (excess.has(oh)) { why.push(`${g} 과다 — 조후 기신 발동`); return -0.5; } return 0; }
    const split = (yo.includes(oh) || yg.split("").some(x => OG[GAN.indexOf(x)] === oh)) &&
                  (go.includes(oh) || xo.includes(oh) ||
                   gg.split("").some(x => OG[GAN.indexOf(x)] === oh) ||
                   xg.split("").some(x => OG[GAN.indexOf(x)] === oh));
    if (split) {
      if (excess.has(oh)) { why.push(`${oh} 과다 — 조후 기신 발동`); return -0.5; }
      return 0;                                        // 갈리는 오행은 중립
    }
    if (yo.includes(oh) || yg.split("").some(x => OG[GAN.indexOf(x)] === oh)) { why.push(`${oh} 조후 용신 계열`); return 0.6; }
    if (go.includes(oh) || gg.split("").some(x => OG[GAN.indexOf(x)] === oh)) { why.push(`${oh} 조후 기신 계열`); return -0.6; }

function ohengPower(natal) {

  natal.pillars.forEach((gz, i) => {

/** 신강도 지수 S (28번 §2) */
function shinGang(natal) {
  const dayGan = natal.dayGan, dOh = OG[GAN.indexOf(dayGan)];
  const GRADE = { "록왕":3, "생지":2, "여기":1, "묘고":0.5 };
  let root = 0;
  natal.zhis.forEach(z => {
    if (!z) return;
    const g = (ROOT_GRADE[dOh] || {})[z];
    if (g) root += GRADE[g] || 0;
  });
  const deuk = (ROOT_GRADE[dOh] || {})[natal.zhis[1]] ? 2 : 0;
  let saengjo = 0;
  [natal.pillars[0], natal.pillars[1], natal.pillars[3]].forEach(gz => {
    if (!gz) return;
    const o = OG[GAN.indexOf(gz[0])];
    if (o === dOh || SHENG[o] === dOh) saengjo += 1;

  const S = Math.min(10, root + deuk + saengjo);

  if (weak)       { yong = new Set([inseong, bigyeop]); gi = new Set([siksang, jaeseong, gwanseong]); note.push(`신약(S=${sg.S}) — 인성·비겁이 용신`); }
  else if (strong){ yong = new Set([siksang, jaeseong, gwanseong]); gi = new Set([inseong, bigyeop]); note.push(`신강(S=${sg.S}) — 식상·재성·관성이 용신`); }
  else            { yong = new Set([inseong, bigyeop]); gi = new Set([jaeseong, gwanseong]); note.push(`중화(S=${sg.S}) — 억부 판정이 약하니 조후를 앞세운다`); }

  // 조후 보정 — 조후 용신 오행을 더하고, 조후 기신은 뺀다
  const jc = JOHU[dayGan] && JOHU[dayGan][natal.pillars[1][1]];
  const johuYong = new Set(), johuGi = new Set();
  if (jc) {
    jc[0].split("").forEach(g => johuYong.add(OG[GAN.indexOf(g)]));
    jc[1].split("").forEach(o => johuYong.add(o));
    jc[4].split("").forEach(g => johuGi.add(OG[GAN.indexOf(g)]));
    jc[5].split("").forEach(o => johuGi.add(o));
    johuYong.forEach(o => { if (!gi.has(o)) yong.add(o); });
    note.push(`조후 용신 ${[...johuYong].join("·") || "—"}`);
  }

  // 무근 용신 경고 (errata #11) — 원국에 동류가 0인 용신 오행
  const pw = ohengPower(natal);
  const rootless = [...yong].filter(o => pw[o] < 0.5);
  if (rootless.length) note.push(`⚠️ ${rootless.join("·")}는 원국에 뿌리가 없어 용신이어도 무력할 수 있다`);
  return { ...sg, yong, gi, johuYong, johuGi, rootless: new Set(rootless), note,
           groups: { inseong, bigyeop, siksang, jaeseong, gwanseong } };
}

/** 넘치는 오행 집합 (조후 과다 판정용) */
function excessSet(natal, extraGz) {
  const p = ohengPower(natal);
  if (extraGz) { p[OG[GAN.indexOf(extraGz[0])]] += 1; p[OZ[ZHI.indexOf(extraGz[1])]] += 1.2; }
  const tot = Object.values(p).reduce((a, b) => a + b, 0) || 1;
  return new Set(Object.keys(p).filter(o => p[o] / tot >= 0.34));
}

/** 간지 하나를 원국에 대입해 5축 채점 → 0~100 */
function scoreGz(natal, gz, ys, opts) {
  opts = opts || {};
  const g = gz[0], z = gz[1];
  const gOh = OG[GAN.indexOf(g)], zOh = OZ[ZHI.indexOf(z)];
  const ex = excessSet(natal, gz);
  const why = [];
  const W = { gyeok: ys.W_gyeok, johu: 18, hap: 22, gam: ys.W_gam, wang: 15 };

  // ① 격국축 — 용신/기신 계열인가
  const gyeokS = oh => ys.yong.has(oh) ? (ys.rootless.has(oh) ? 0.35 : 0.85)
                     : ys.gi.has(oh) ? -0.8 : 0;
  const a1g = gyeokS(gOh), a1z = gyeokS(zOh);
  if (a1g) why.push(`천간 ${g}(${sipsin(natal.dayGan, g)}) ${a1g > 0 ? "용신" : "기신"} 계열`);
  if (a1z) why.push(`지지 ${z} ${a1z > 0 ? "용신" : "기신"} 계열`);

  // ② 조후축
  const jo = johuAxis(natal.dayGan, natal.pillars[1][1], g, z, ex);
  why.push(...jo.why);

  // ③ 합충축
  const rels = relationsTo(natal, z);
  const boundInNatal = zh => natal.inner.some(x =>
    (x.a.endsWith(zh) || x.b.endsWith(zh)) &&
    x.r.some(v => v === "육합" || v === "반합" || v === "방합"));
  let a3 = 0;
  rels.forEach(r => {
    const rOh = OZ[ZHI.indexOf(r.zhi)];
    const isYong = ys.yong.has(rOh), isGi = ys.gi.has(rOh);
    const strong = r.rel.some(x => x === "충" || x === "형" || x === "자형");
    const bind = r.rel.some(x => x === "육합" || x === "반합" || x === "방합");
    if (strong) {
      // §2-2 ① 충산합해 — 원국 합에 묶여 있던 글자를 충하면 손상이 아니라 해방
      if (boundInNatal(r.zhi) && isYong) {
        a3 += 0.45;
        why.push(`${r.pos}지 ${r.zhi} ${r.rel.join("·")} — 합에 묶였던 용신이 풀린다(충산합해)`);
      } else {
        a3 += isGi ? 0.5 : isYong ? -0.6 : -0.2;
        if (r.pos === "월") a3 -= 0.25;                     // 월지 동요는 격국 근거를 흔든다
        why.push(`${r.pos}지 ${r.zhi} ${r.rel.join("·")} — ${isGi ? "기신 제거" : isYong ? "용신 손상" : "구조 동요"}`);
      }
    } else if (bind) {
      a3 += isYong ? -0.25 : isGi ? 0.3 : 0.1;
      if (r.pos === "월") a3 -= 0.15;
    } else a3 -= 0.1;
  });
  a3 = Math.max(-1, Math.min(1, a3));

  // 기신 과열 — 이미 넘치는 기신을 또 보태면 가중 처벌
  let overheat = 0;
  [gOh, zOh].forEach(o => { if (ys.gi.has(o) && ex.has(o)) overheat -= 0.3; });
  if (overheat) why.push("이미 넘치는 기신을 더 보탠다");

  // ④ 감당력축 — 일간 뿌리 보전 / 설기
  const dOh = OG[GAN.indexOf(natal.dayGan)];
  let a4 = 0;
  if (zOh === dOh || SHENG[zOh] === dOh) a4 += 0.7;          // 비겁·인성 지지
  if (SHENG[dOh] === zOh) a4 -= 0.45;                        // 설기
  if (KE[zOh] === dOh) a4 -= 0.6;                            // 극
  const hurtRoot = rels.some(r => r.rel.includes("충") &&
    (ROOT_GRADE[dOh] || {})[r.zhi]);
  if (hurtRoot) { a4 -= 0.5; why.push("일간 뿌리를 충한다"); }
  a4 = Math.max(-1, Math.min(1, a4));

  // ⑤ 왕쇠·신살축 (운성 9 / 신살 6)
  const un = unseong(natal.dayGan, z, "eum");
  let unS = (UN_POWER[un] || 0) / 3;
  const s12 = sinsal12(natal.yearZhi, z);
  const SIN_S = { 장성살:0.5, 반안살:0.5, 년살:0.3, 지살:0.3, 화개살:0.1, 천살:-0.3,
                  월살:-0.4, 겁살:-0.4, 망신살:-0.3, 육해살:-0.3, 재살:-0.5, 역마살:0 };
  let sinS = SIN_S[s12] || 0;
  if (natal.gongmangZhi.includes(z)) { sinS -= 0.4; why.push(`${z}는 공망지`); }
  const a5 = (unS * 9 + sinS * 6) / 15;

  // 고립 감쇠 (errata #11) — 용신 지지가 원국에 뿌리 없을 때
  let isolate = 1;
  if (ys.yong.has(zOh) && ys.rootless.has(zOh)) {
    isolate = 0.6;
    const wangChung = rels.some(r => r.rel.includes("충") &&
      relationsTo(natal, r.zhi).length >= 2);
    const dissolve = ohengPower(natal)[Object.keys(KE).find(o => KE[o] === zOh) || ""] >= 3;
    if (wangChung) isolate *= 0.3;
    if (dissolve) isolate *= 0.4;
    const freed = rels.some(r => r.rel.some(x => x === "반합" || x === "육합" || x === "방합")) &&
             !rels.some(r => r.rel.includes("충"));
    if (freed) isolate = 1;
    else why.push(`${z}는 뿌리 없는 용신 — 고립 감쇠 ×${isolate.toFixed(2)}`);
  }

  // 절각 감쇠 — 층위 천간이 어디에도 통근 못 하면
  const ganRooted = natal.zhis.concat([z]).some(x => x && (ROOT_GRADE[gOh] || {})[x]);
  const ganDamp = ganRooted ? 1 : 0.7;

  // §2-2 ② 생 사슬(통로) — 기둥 자체가 원국 주 세력의 출구를 열면 순세로 본다
  const grpOf = oh => SIPSIN_OF_OH(natal.dayGan, oh);
  let flow = 0;
  if (SHENG[gOh] === zOh || SHENG[zOh] === gOh) {
    const pw0 = ohengPower(natal);
    const domOh = Object.keys(pw0).reduce((a, b) => pw0[a] >= pw0[b] ? a : b);
    if (ys.gi.has(domOh) && (gOh === domOh || zOh === domOh)) {
      // 뿌리가 살아 있을 때만 (뿌리 없으면 재다신약 가속)
      if (natal.roots.length) { flow = 0.35; why.push("과한 기운이 다음 단계로 흘러 나갈 통로가 생긴다"); }
    }
  }

  const ganAxes = [a1g * ganDamp + overheat * 0.5 + flow, jo.s, a3 * 0.5, a4 * 0.4, a5 * 0.4];
  const zhiAxes = [a1z * isolate + overheat + flow, jo.s, a3, a4, a5];
  const Ws = [W.gyeok, W.johu, W.hap, W.gam, W.wang];
  const mix = arr => 50 + arr.reduce((acc, v, i) => acc + v * Ws[i], 0) / 2;
  const ganScore = Math.max(0, Math.min(100, mix(ganAxes)));
  const zhiScore = Math.max(0, Math.min(100, mix(zhiAxes)));
  const first = ganScore * 0.7 + zhiScore * 0.3;
  const last  = ganScore * 0.3 + zhiScore * 0.7;
  const total = Math.round(Math.max(0, Math.min(100, (first + last) / 2)));

  // 순세 태그 (§4)
  const sgrp = SIPSIN_OF_OH(natal.dayGan, gOh), zgrp = SIPSIN_OF_OH(natal.dayGan, zOh);
  let tag = "수렴기";
  if (rels.some(r => r.rel.includes("충") || r.rel.includes("형"))) tag = "전환기";
  else if ([sgrp, zgrp].includes("인성")) tag = "축적기";
  else if ([sgrp, zgrp].some(x => x === "식상" || x === "비겁")) tag = "발산기";
  if (a1g < 0 && a1z < 0 && a4 < 0) tag = "방어기";

  return { gz, total, band: bandOf(total), tag, ganScore: Math.round(ganScore),
           zhiScore: Math.round(zhiScore), why,
           axes: { 격국: +a1z.toFixed(2), 조후: +jo.s.toFixed(2), 합충: +a3.toFixed(2),
                   감당력: +a4.toFixed(2), 왕쇠신살: +a5.toFixed(2) },
           un, s12, isolate };
}

/** 원국 기저점수 — 층위 점수를 체감으로 블렌딩할 때 쓴다 */
function natalBase(natal, ys) {
  const pw = ohengPower(natal);
  const tot = Object.values(pw).reduce((a, b) => a + b, 0) || 1;
  let s = 0;
  ys.yong.forEach(o => { s += (pw[o] / tot) * 1.6; });
  ys.gi.forEach(o => { s -= (pw[o] / tot) * 0.9; });
  s += Math.min(0.25, natal.roots.length * 0.08);
  if (natal.sinsal.some(x => x.n === "천을귀인")) s += 0.06;
  if (natal.sinsal.some(x => x.n === "문창귀인")) s += 0.04;
  const zero = ["木","火","土","金","水"].filter(o => pw[o] < 0.5);
  s -= zero.length * 0.08;
  return Math.max(0, Math.min(100, Math.round(50 + s * 50)));
}
const feelScore = (base, layers) => {                        // 체감운 (§1)
  let num = base * 55, den = 55;
  layers.forEach(l => { num += l.score * l.w; den += l.w; });
  return Math.round(num / den);
};

/* ══ 렌더 ═══════════════════════════════════════ */
const fmtD  = m => { const d = kd(m); return `${d.getUTCFullYear()}.${String(d.getUTCMonth() + 1).padStart(2, "0")}.${String(d.getUTCDate()).padStart(2, "0")}`; };
const fmtDT = m => { const d = kd(m); return `${fmtD(m)} ${String(d.getUTCHours()).padStart(2, "0")}:${String(d.getUTCMinutes()).padStart(2, "0")}`; };
const fmtMD = m => { const d = kd(m); return `${String(d.getUTCMonth() + 1).padStart(2, "0")}/${String(d.getUTCDate()).padStart(2, "0")}`; };
const gzKo  = s => GAN_KO[GAN.indexOf(s[0])] + ZHI_KO[ZHI.indexOf(s[1])];
const el = (t, c, h) => { const n = document.createElement(t); if (c) n.className = c; if (h != null) n.innerHTML = h; return n; };

let NATAL, PERIODS, CURRENT = "month0";

function computePeriods(natal) {
  const now = kmin(nowKd());
  const out = {};

  // 월운
  const s0 = jieSlot(now), s1 = slotByIndex(s0.i + 1);
  [[s0, "month0", "이번 달"], [s1, "month1", "다음 달"]].forEach(([s, key, label]) => {
    const yp = yearPillar(s.jieYear), mz = MONTH_ZHI[s.k];
    out[key] = { kind: "month", label, ganzhi: monthGan(yp[0], mz) + mz, start: s.start, end: s.end,
                 anchor: (now >= s.start && now <= s.end) ? now : s.start,
                 note: `${JIE[s.k]} → ${JIE[(s.k + 1) % 12]} 직전`, slot: s };
  });

  // 세운
  const jy = s0.jieYear;
  [[jy, "year0", "올해"], [jy + 1, "year1", "내년"]].forEach(([y, key, label]) => {
    out[key] = { kind: "year", label, ganzhi: yearPillar(y), start: termAt(y, 0), end: termAt(y + 1, 0),
               anchor: (now >= termAt(y, 0) && now < termAt(y + 1, 0)) ? now : termAt(y, 0),
                 note: `${y}년 입춘 → ${y + 1}년 입춘 직전`, jieYear: y };
  });

  // 주운 — 월요일 시작
  const today = kd(now);
  const midnight = Math.floor(now / 1440) * 1440;
  const dow = (today.getUTCDay() + 6) % 7;                 // 월=0
  [[0, "week0", "이번 주"], [1, "week1", "다음 주"]].forEach(([off, key, label]) => {
    const mon = midnight - dow * 1440 + off * 7 * 1440;
    const days = [];
    for (let i = 0; i < 7; i++) {
      const dm = mon + i * 1440 + 720;                     // 정오 기준
      const dgz = dayPillar(dm);
      const rels = relationsTo(natal, dgz[1]);
      days.push({ min: mon + i * 1440, gz: dgz, rels, w: rels.reduce((a, r) => a + r.weight, 0),
                  isToday: mon + i * 1440 === midnight });
    }
    const bg = jieSlot(mon + 3 * 1440 + 720);
    const ypb = yearPillar(bg.jieYear), mzb = MONTH_ZHI[bg.k];
    out[key] = { kind: "week", label, days, start: mon, end: mon + 7 * 1440 - 1,
                 anchor: (now >= mon && now < mon + 7 * 1440) ? now : mon,
                 monthGz: monthGan(ypb[0], mzb) + mzb,
                 ganzhi: days.slice().sort((a, b) => b.w - a.w || a.min - b.min)[0].gz,
                 note: `${fmtMD(mon)} 월요일 → ${fmtMD(mon + 6 * 1440)} 일요일` };
    const maxW = Math.max(...days.map(d => d.w));
    days.forEach(d => { d.marked = d.w >= 4 && d.w === maxW; });
  });
  return out;
}

/** 명식판 한 칸 — 운/원국 공용 */

      `<div class="glyph r-gan" style="color:var(--ink-faint)">—<span class="ko">${spec.emptyNote || "없음"}</span></div>` +
      `<div class="glyph r-zhi" style="color:var(--ink-faint)">—</div>` +
      `<div class="slot r-slot"><b>·</b></div><div class="slot r-slot"><b>·</b></div><div class="slot r-slot"><b>·</b></div>`;
    return c;
  }
  const G = spec.gz[0], Z = spec.gz[1];

    `<div class="cap r-cap"><b>${spec.cap}</b>${spec.badge ? ` <span class="wbadge">${spec.badge}</span>` : ""}` +

    `<div class="slot r-slot"><b>${spec.isDay ? "일간 " + G : sipsin(n.dayGan, G)}</b>` +
      `<span class="alt">지지 ${sipsin(n.dayGan, JANGGAN[Z].slice(-1))}</span></div>` +
    `<div class="slot r-slot"><b>${sinsal12(n.yearZhi, Z)}</b>` +
      `<span class="alt">일지 기준 ${sinsal12(n.dayZhi, Z)}</span></div>` +
    `<div class="slot r-slot"><b>${unseong(n.dayGan, Z, "eum")}</b>` +
      `<span class="alt">양포태 ${unseong(n.dayGan, Z, "yang")}</span></div>`;
  if (spec.aria) c.setAttribute("aria-label", spec.aria);
  return c;
}

    (n.timeKnown ? ` · ${ZHI_KO[ZHI.indexOf(n.pillars[3][1])]}시` : ""));
  addSub("일간", `<b class="m${OG[GAN.indexOf(n.dayGan)]}">${n.dayGan}</b> ${GAN_KO[GAN.indexOf(n.dayGan)]}${OG[GAN.indexOf(n.dayGan)]} · ${GAN_DESC[n.dayGan]}`);
  addSub("띠", `${ANIMAL[ZHI.indexOf(n.yearZhi)]}띠 · ${n.guk} ${GUK_NAME[n.guk]} 기준`);
  addSub("절기", `${JIE[tslot.k]} 이후 ${Math.floor((now - tslot.start) / 1440)}일째`);

  renderDaily(n);

  /* 명식 그리드 — 운 4칸 ‖ 원국 4칸 */
  renderBoard(n, ST);

  /* 눈금 */
  const scale = document.getElementById("scale");
  if (!scale.dataset.built) {
    [["week0", "이번 주"], ["week1", "다음 주"], ["month0", "이번 달"], ["month1", "다음 달"], ["year0", "올해"], ["year1", "내년"]]
      .forEach(([k, lab]) => {
        const b = el("button", "", `<span class="t">${k.startsWith("week") ? "WEEK" : k.startsWith("month") ? "MONTH" : "YEAR"}</span><span class="n">${lab}</span> <span class="gz"></span>`);
        b.type = "button"; b.setAttribute("role", "tab"); b.dataset.k = k;
        b.addEventListener("click", () => { CURRENT = k; render(); });
        scale.append(b);
      });
    scale.dataset.built = "1";
  }
  [...scale.children].forEach(b => {
    const pd = PERIODS[b.dataset.k];
    b.setAttribute("aria-selected", b.dataset.k === CURRENT ? "true" : "false");
    const pl = resolveLayers(n, pd.anchor, TODAY);
    const se = pl.find(x => x.key === "se").gz, wo = pl.find(x => x.key === "wol").gz;
    b.querySelector(".gz").innerHTML = `<span class="mono" style="font-size:11px;color:var(--ink-faint)">${se} / ${wo}</span>`;
  });

  /* 원장 */
  const L = document.getElementById("ledger");
  L.innerHTML = "";
  const row = (k, v) => { const d = el("div", "ldr-row"); d.innerHTML = `<dt>${k}</dt><dd>${v}</dd>`; L.append(d); };
  row(p.kind === "week" ? "핵심 일진" : "간지",
      `<span class="m${rd.gO}" style="font-family:var(--serif);font-size:19px;font-weight:600">${rd.ganzhi}</span> <span class="mono" style="font-size:12px;color:var(--ink-dim)">${gzKo(rd.ganzhi)}</span>` +
      `<span class="sub">${rd.gzRel}</span>` +
      (p.kind === "week" ? `<span class="sub">그 주 7일 중 원국에 가장 세게 걸리는 날입니다. 명식판의 일운(오늘) 칸과는 별개입니다.</span>` : ""));
  row("기간", `<span class="mono">${p.kind === "year" || p.kind === "month" ? fmtDT(p.start) : fmtD(p.start)}</span><span class="sub">→ ${p.kind === "year" || p.kind === "month" ? fmtDT(p.end) : fmtD(p.end)} · ${p.note}</span>`);
  if (p.kind === "week") row("배경", `월운 <b>${p.monthGz}</b><span class="sub">주(週)는 명리 고유 단위가 아니라, 일진 7개를 묶어 본 배치입니다.</span>`);
  row("12신살", `<span class="tag hit">${rd.s12y}</span><span class="sub">년지 ${n.yearZhi} · ${n.guk}(${GUK_NAME[n.guk]}) 기준 — ${SINSAL_DESC[rd.s12y].tag}</span>` +
      (rd.s12d !== rd.s12y ? `<span class="sub">일지 ${n.dayZhi} 기준으로는 <b>${rd.s12d}</b> — 두 기준이 갈립니다</span>` : ""));
  row("십이운성", `<span class="tag ${UN_POWER[rd.unY] >= 2 ? "wang" : UN_POWER[rd.unY] <= -1 ? "swe" : ""}">${rd.unY}</span><span class="sub">일간 ${n.dayGan} 기준 · 음포태. 양포태로는 ${rd.unYang}</span>`);
  row("십신", (rd.alive.length ? `살아있는 쪽 ${rd.alive.map(x => `<span class="tag wang">${x.s}·${x.un}</span>`).join("")}` : "두드러지게 살아있는 십신 없음") +
      (rd.down.length ? `<span class="sub" style="margin-top:5px">눌린 쪽 ${rd.down.map(x => `<span class="tag swe">${x.s}·${x.un}</span>`).join("")}</span>` : ""));
  row("관계", rd.rels.length
    ? `<ul class="rels" style="margin:0">${rd.rels.map(r => `<li><span class="who">${r.pos}지 ${r.zhi}</span><span class="what"><b>${r.rel.join(" · ")}</b> <span>${GUNG[r.pos].short}</span></span></li>`).join("")}</ul>`
    : "원국 지지와 직접 걸리는 관계 없음 — 조용한 구간");
  if (rd.gongmang) row("공망", `<b>${rd.z}</b>는 일주 기준 공망지<span class="sub">뜻은 서는데 실체가 덜 잡히는 결. 학파에 따라 운에서 채워지면 정상 작동으로 봅니다.</span>`);

  /* 서술 */
  const zd = ZHI_DESC[rd.z], sd = SINSAL_DESC[rd.s12y];
  const PR = document.getElementById("prose");
  const relTop = rd.rels[0];
  const headline = p.kind === "week"
    ? `${p.label} — ${sd.tag}`
    : `${rd.ganzhi}${p.kind === "month" ? "월" : "년"} — ${sd.tag}`;

  let html = `<h2>${headline}</h2><p class="lede">${zd.theme}</p>`;

  html += `<h3>이 기간의 배경</h3>`;
  html += `<p><b>${rd.z}(${ZHI_KO[ZHI.indexOf(rd.z)]})</b>는 ${zd.season}, 하루로 치면 ${zd.clock}에 해당하는 ${zd.kind}입니다. ${zd.img}.
           천간 <b>${rd.g}</b>는 ${GAN_DESC[rd.g]}. ${rd.gzRel}.</p>`;
  if (p.kind === "week") html += `<p>배경이 되는 달은 <b>${p.monthGz}</b>월입니다. 주간의 결은 이 달의 기조 안에서 움직이며, 아래 7일의 일진이 그 안에서 강약을 만듭니다.</p>`;

  html += `<h3>나에게 — 일간 ${n.dayGan}</h3>`;
  html += `<p>${n.dayGan} 일간에게 ${rd.z}는 <b>${rd.unY}</b>의 자리입니다. ${UN_DESC[rd.unY]}</p>`;
  if (rd.aliveG.length) html += `<p><b>쓸 수 있는 카드</b> — ${rd.aliveG.map(g => `${g}(${GROUP_DESC[g]})`).join(", ")}. ${rd.alive.slice(0, 3).map(x => `${x.s}가 ${x.un}`).join(", ")}에 들어 이쪽으로 손을 대면 붙습니다.</p>`;
  if (rd.downG.length) html += `<p><b>기대를 낮출 영역</b> — ${rd.downG.map(g => `${g}`).join(", ")}. ${rd.down.slice(0, 3).map(x => `${x.s}가 ${x.un}`).join(", ")}이라 힘을 실어도 되돌아오는 게 적습니다.</p>`;

  html += `<h3>나에게 — 12신살 ${rd.s12y}</h3>`;
  html += `<p>년지 ${n.yearZhi}(${ANIMAL[ZHI.indexOf(n.yearZhi)]}띠)는 ${n.guk} ${GUK_NAME[n.guk]}에 속합니다. 그 기준으로 ${rd.z}는 <b>${rd.s12y}</b> 자리입니다.</p>`;
  html += `<p><b>이렇게 쓰면 순방향</b> — ${sd.plus}<br><b>이렇게 가면 소모</b> — ${sd.minus}</p>`;
  if (rd.s12d !== rd.s12y) html += `<p style="color:var(--ink-dim)">일지 ${n.dayZhi} 기준으로 보면 같은 자리가 <b>${rd.s12d}</b>가 됩니다. 12신살 기준 지지는 학파가 갈리는 지점이라 둘 다 적어 둡니다 — 총운은 년지, 개인의 체감은 일지 쪽으로 읽는 견해가 많습니다.</p>`;

  html += `<h3>원국과 맞물리는 자리</h3>`;
  if (rd.rels.length) {
    html += `<ul class="rels">` + rd.rels.map(r => {
      const main = r.rel.find(x => REL_INFO[x]) || r.rel[0];
      return `<li><span class="who">${r.pos}지 ${r.zhi}</span><span class="what"><b>${r.rel.join(" · ")}</b> — ${(REL_INFO[main] || { t: "" }).t}<br><span>영역: ${GUNG[r.pos].area}</span></span></li>`;
    }).join("") + `</ul>`;
    html += `<p style="margin-top:12px">가장 세게 걸리는 자리는 <b>${relTop.pos}지</b>입니다. 이 기간의 일은 주로 ${GUNG[relTop.pos].area} 쪽에서 생깁니다.</p>`;
  } else {
    html += `<p>원국 지지와 직접 걸리는 합·충·형·파·해·원진·귀문·격각이 없습니다. 사건이 밖에서 밀고 들어오기보다, 위의 십이운성과 12신살이 만드는 <b>내부 온도</b>로 지나가는 구간입니다.</p>`;
  }

  /* ── 네 층위 (오늘과 같은 시점이면 위에서 이미 읽었으므로 반복하지 않는다) ── */
  const sameAsToday = p.anchor === TODAY;
  html += `<h3>네 층위 — 대운 · 세운 · 월운 · 일운</h3>`;
  if (sameAsToday) {
    html += `<p style="color:var(--ink-dim)">이 기간의 기준 시점은 오늘입니다. 네 층위는 <b>${ST.perLayer.filter(x => !x.empty).map(x => `${x.name} ${x.gz}`).join(" · ")}</b>으로, 맨 위 '오늘'에서 한 줄씩 읽은 것과 같습니다.</p>`;
  } else {
    html += `<p style="color:var(--ink-dim);font-size:13px">기준 시점 <span class="mono">${fmtD(p.anchor)}</span> — 이 기간은 오늘을 포함하지 않아 기간의 시작으로 잡았습니다. 일운만 오늘로 고정됩니다.</p>`;
    html += `<div class="layerlines">` + ST.perLayer.map(L => {
      const nm = LAYER_DEF.find(x => x.key === L.key);
      return `<div class="ll"><span class="lk"><b>${nm.name}</b>${L.empty ? "—" : L.gz}<br>${nm.role} · ${nm.w}</span>` +
             `<span>${layerLine(n, ST, L.key)}</span></div>`;
    }).join("") + `</div>`;
  }

  html += `<h3>겹치는 자리</h3>`;
  if (ST.focus.length) {
    html += `<div class="focus">` + ST.focus.map(f => {
      const segs = LAYER_DEF.map(L => {
        const h = f.hits.find(x => x.key === L.key);
        return h ? `<i class="l-${L.key}" style="width:${(h.sub / f.score * 100).toFixed(1)}%" title="${L.name} ${h.rel.join('·')}"></i>` : "";
      }).join("");
      return `<div class="fs"><div class="hd"><b>${f.pos}지 ${f.zhi}</b><span class="ar">${f.area}</span>` +
        `<span class="sc">층위 ${f.layerCount} · ${f.score}</span></div>` +
        `<div class="fsbar">${segs}</div>` +
        `<div class="lg">${f.hits.map(h => `<em>${h.name}</em> ${h.rel.join("·")}`).join(" · ")}` +
        (f.volatile ? `<br><em>이번 기간에 새로 움직이는 몫(대운 제외) ${f.volatile}</em>` : "") + `</div></div>`;
    }).join("") + `</div>`;
  } else {
    html += `<p>두 층위 이상이 한 자리에 겹치는 곳이 없습니다. 각 층위가 따로 굴러가는 구간입니다.</p>`;
  }
  html += `<div class="stackbox">` + stackProse(n, ST).map(b => `<p>${b}</p>`).join("") + `</div>`;

  html += `<div class="verdict"><div class="do"><span class="lab">이 기간에 할 것 하나</span><strong>${sd.act}</strong></div>` +
          `<div><span class="lab">접을 것 하나</span><strong>${sd.stop}</strong></div></div>`;
  PR.innerHTML = html;

  /* 주간 스트립 */
  const wb = document.getElementById("weekBox");
  if (p.kind === "week") {
    wb.hidden = false;
    document.getElementById("weekLede").innerHTML =
      weekLede(n, p).map(t => `<p style="margin:0 0 .5em">${t}</p>`).join("");
    const wd = document.getElementById("weekDays");
    wd.innerHTML = "";
    p.days.forEach((d, i) => {
      const marked = d.marked;
      const c = el("div", "day" + (d.isToday ? " today" : "") + (marked ? " marked" : ""));
      const top = d.rels[0];
      c.innerHTML = `<span class="dow">${"MON TUE WED THU FRI SAT SUN".split(" ")[i]}</span>` +
        `<span class="dt">${fmtMD(d.min)}</span>` +
        `<span class="gz m${OZ[ZHI.indexOf(d.gz[1])]}">${d.gz}</span>` +
        `<span class="mk">${top ? top.rel[0] + " · " + GUNG[top.pos].short : ""}</span>` +
        `<span class="s12">${sinsal12(n.yearZhi, d.gz[1])}</span>`;
      wd.append(c);
    });
    const wl = document.getElementById("weekLines");
    wl.innerHTML = p.days.map((d, i) => {
      const dow = "월화수목금토일"[i];
      return `<div class="wl${d.isToday ? " today" : ""}${d.marked ? " marked" : ""}">` +
        `<span class="k">${dow} ${fmtMD(d.min)}<b class="m${OZ[ZHI.indexOf(d.gz[1])]}">${d.gz}</b></span>` +
        `<span class="t">${dayLine(n, d.gz, d.marked)}</span></div>`;
    }).join("");
  } else wb.hidden = true;

  /* 하단 패널 */
  const bars = document.getElementById("ohengBars");
  bars.innerHTML = "";
  const total = Object.values(n.cnt).reduce((a, b) => a + b, 0) || 1;
  ["木", "火", "土", "金", "水"].forEach(o => {
    const b = el("div", "bar");
    b.innerHTML = `<span class="nm m${o}">${o}</span><span class="tr"><span class="fl b${o}" style="width:${(n.cnt[o] / total * 100).toFixed(1)}%"></span></span><span class="ct">${n.cnt[o]}</span>`;
    bars.append(b);
  });
  const sk = document.getElementById("structKv");
  sk.innerHTML = `<dt>격 후보</dt><dd>${n.gyeok}<br><span style="font-size:11px">월지 투출 기준 1차 후보입니다. 용신·격의 성패 판정은 별도 감명이 필요합니다.</span></dd>` +
                 `<dt>일간 뿌리</dt><dd>${n.roots.length ? "<b>" + n.roots.join(" · ") + "</b>" : "<b>무근(無根)</b>"}</dd>`;

  const ns = document.getElementById("natalSinsal");
  ns.innerHTML = n.sinsal.map(s => `<div style="padding:5px 0;border-bottom:1px dotted var(--rule-soft);font-size:12.5px"><b style="font-weight:500">${s.n}</b> <span class="tag">${s.g}</span><br><span style="color:var(--ink-dim);font-size:12px">${s.v}</span></div>`).join("") +
    `<div style="padding:7px 0;font-size:12.5px;color:var(--ink-dim)">삼재 — ${n.guk}생은 <b style="color:var(--ink)">${SAMJAE[n.guk]}</b>년<span class="tag" style="margin-left:6px">B~C</span></div>` +
    (n.inner.length ? `<div style="margin-top:10px"><span class="eyebrow">원국 내부 관계</span><br>${n.inner.map(x => `<span style="font-size:12.5px;color:var(--ink-dim)">${x.a}—${x.b} <b style="color:var(--ink)">${x.r.join("·")}</b></span>`).join("<br>")}</div>` : "");

  const dwBox = document.getElementById("daewoon");
  dwBox.innerHTML = "";
  const curJieYear = jieSlot(kmin(nowKd())).jieYear;
  let curIdx = -1;
  n.dw.list.forEach((d, i) => { if (curJieYear >= d.year) curIdx = i; });
  n.dw.list.forEach((d, i) => {
    const c = el("div", "dw" + (i === curIdx ? " on" : ""));
    c.innerHTML = `<span class="a">${d.age}세</span><span class="g m${OZ[ZHI.indexOf(d.gz[1])]}">${d.gz}</span><span class="a">${d.year}</span>`;
    dwBox.append(c);
  });
  const cur = curIdx >= 0 ? n.dw.list[curIdx] : null;
  document.getElementById("daewoonKv").innerHTML =
    `<dt>순역</dt><dd>${n.dw.rule}</dd>` +
    (cur ? `<dt>현재</dt><dd><b>${cur.gz}</b> 대운 (${cur.age}세~) · 천간 ${sipsin(n.dayGan, cur.gz[0])} / 지지 ${sipsin(n.dayGan, JANGGAN[cur.gz[1]].slice(-1))} · 12신살 <b>${sinsal12(n.yearZhi, cur.gz[1])}</b></dd>` : "");

  /* 콜로폰 */
  document.getElementById("colophon").innerHTML =
    `<b>계산 기준</b> · 절기는 태양 겉보기 황경 315°+30°k 통과 시각(KST, 분 단위 실계산). 연주는 입춘, 월주는 절입 기준. 일주는 1900-01-01=甲戌 기준이며 23시 초과 출생은 익일로 넘깁니다. 진태양시 −32분(서울 경도) 적용.<br>` +
    `<b>네 층위를 뽑는 시점</b> · 대운·세운·월운은 <b>기준 시점</b>으로 계산합니다 — 고른 기간이 지금을 포함하면 지금, 아니면 그 기간의 시작. <b>일운만 언제나 오늘로 고정</b>합니다. "오늘의 나"를 움직이지 않는 기준점으로 둬야 상위 세 층위를 옮겨 볼 때 무엇이 달라지는지가 보이기 때문입니다.<br>` +
    `<b>겹치는 자리</b> · 초점 강도는 Σ(층위 비중 × 관계 세기)입니다. 층위 비중은 대운 25 · 세운 12 · 월운 5 · 일운 3. 대운이 8배 무거워 순위는 잘 안 바뀌므로, 탭에 따라 실제로 움직이는 몫을 <em style="font-style:normal">대운 제외 점수</em>로 따로 적었습니다. 이 점수는 요약 지표이며 운 채점 모델에 더하지 않습니다.<br>` +
    `<b>삼합·방합</b> · 원국 글자만으로 이미 서 있는 국은 세지 않고, <b>운이 들어와 완성된 것만</b> 표시합니다. 운에서 온 글자는 그 운이 지나면 풀립니다.<br>` +
    `<b>이론 근거</b> · 십이신살은 년지 삼합국 기준(일지 기준 병기), 십이운성은 음포태(양포태 병기), 지지 관계는 합·충·형·파·해에 원진·귀문·격각을 더해 봅니다. 층위 중첩·복음·반음은 31번 문서 §6, 천간충은 22번 §1-4가 정본입니다. 신살에는 신뢰도 등급(A~D)을 붙였고 C·D는 단독 판정에 쓰지 않습니다.<br>` +
    `<b>읽는 법</b> · 이 페이지는 <b>신살·십이운성·지지 관계</b> 층위를 그린 것입니다. 격국과 용신의 성패 판정은 담고 있지 않으므로, 여기 나온 길흉의 결은 참고이지 결론이 아닙니다. 하위 층위는 상위 기조를 뒤집지 못합니다 — 원국 55 · 대운 25 · 세운 12 · 월운 5 · 일운 3.<br>` +
    `<b>마지막 갱신</b> · <span class="mono">${fmtDT(kmin(nowKd()))}</span>`;
}

/* ══════════════════════════════════════════════════════════════
   DAILY — 매일 아침 다시 쓰이는 구간. 이 블록만 갱신됩니다.
   for      : 이 글이 가리키는 날짜 (KST, YYYY-MM-DD)
   profile  : 이 글을 쓴 기준 명식 "생년월일|시각|성별"
   ══════════════════════════════════════════════════════════════ */
const DAILY = {
  for: "2026-09-06",
  profile: "1995-10-29|06:30|M",
  title: "판이 하나로 묶이는 날",
  body: "오늘은 네 층위가 전부 월지 戌 자리로 몰립니다. 대운 癸未와 일운 癸未가 같은 간지로 겹치는 복음이라, 새로 벌어지는 일이 아니라 몇 해째 끌고 오던 것이 한 번 더 눌리는 결에 가깝습니다. 여기에 원국 亥·卯가 운의 未를 만나 亥卯未 목국이 서고, 일지 巳는 세운 午·대운 未와 巳午未 남방 화국으로 함께 묶입니다. 묶이는 힘이 강한 날은 혼자 판단하는 것보다 이미 엮여 있는 쪽에서 답이 나오기 쉽습니다. 다만 대운 未·세운 午·일운 未가 모두 공망지라, 손에 잡히는 결과보다 방향이 정해지는 정도로 지나갈 가능성이 높습니다.",
  act: "혼자 쥐고 있던 것 하나를 이미 엮여 있는 사람에게 꺼내 놓는다",

  /* ↓ 선택 필드. 없으면 각각 독립적으로 엔진이 채운다.
       sig = 글을 쓸 당시의 4층 서명. 대운·절기 경계를 넘기면 자동으로 폴백된다. */
  rev: 2,
  sig: "癸未|丙午|丙申|癸未"
};

function renderDaily(natal) {
  const box = document.getElementById("daily");
  const now = kmin(nowKd());
  const todayKey = fmtD(now).replace(/\./g, "-");
  const L = resolveLayers(natal, now, now);
  const st = readStack(natal, L);
  const il = st.perLayer.find(x => x.key === "il");
  const gzT = il.gz, zT = il.z;

  const sameProfile = `${natal.profile.date}|${natal.profile.time}|${natal.profile.gender}` === DAILY.profile;
  const freshDay = DAILY.for === todayKey && sameProfile;
  const sig = L.map(x => x.empty ? "—" : x.gz).join("|");
  const sigOk = !DAILY.sig || DAILY.sig === sig;
  /* 사람이 쓴 글은 문체만 제공한다. 아래 사실 스트립은 언제나 엔진 계산값이다. */
  const pick = (v, fb) => (freshDay && sigOk && typeof v === "string" && v.trim()) ? v : fb;

  const meta = `<div class="meta">` +
    `<div>12신살 <b>${il.s12y}</b> · ${SINSAL_DESC[il.s12y].tag}</div>` +
    `<div>십이운성 <b>${il.unY}</b></div>` +
    L.filter(x => !x.empty).map(x => `<div><em style="font-style:normal;color:var(--ink-faint)">${x.name}</em> <b>${x.gz}</b></div>`).join("") +
    `</div>`;

  const lines = LAYER_DEF.map(D => {
    const txt = pick(DAILY.layers && DAILY.layers[D.key], layerLine(natal, st, D.key));
    return `<div class="ll"><span class="lk"><b>${D.name}</b>${D.role} · ${D.w}</span><span>${txt}</span></div>`;
  }).join("");

  const auto = stackProse(natal, st);
  const humanBody = freshDay && DAILY.body && DAILY.body.trim();
  const stackTxt = (freshDay && sigOk && DAILY.stack && DAILY.stack.trim())
    ? `<p>${DAILY.stack}</p>`
    : humanBody ? ""                                  /* 사람 글이 결합 서술을 겸한다 */
    : `<p>${auto[0]}</p>` + (auto[1] ? `<p>${auto[1]}</p>` : "");

  const head = freshDay ? DAILY.title : `오늘 — ${SINSAL_DESC[il.s12y].tag}`;
  const body = freshDay && DAILY.body && DAILY.body.trim() ? `<p>${DAILY.body}</p>` : "";
  const act  = freshDay && DAILY.act ? DAILY.act : SINSAL_DESC[il.s12y].act;

  let stale = "";
  if (!sameProfile) stale = `아침 글은 기본 명식 기준으로 쓰입니다. 지금은 직접 입력한 명식으로 보고 계셔서, 위 네 줄과 결합 문단은 엔진 계산값으로 채웠습니다.`;
  else if (DAILY.for !== todayKey) stale = `아침 글은 ${DAILY.for} 기준으로 쓰인 것이라, 위 내용은 오늘 날짜로 다시 계산해 자동으로 채웠습니다.`;
  else if (!sigOk) stale = `아침 글을 쓴 시점과 네 층위 간지가 달라져(대운·절기 경계) 층위 서술은 엔진 계산값으로 대신했습니다.`;

  box.innerHTML =
    `<div class="stampcol"><div class="ilju m${OZ[ZHI.indexOf(zT)]}">${gzT}<small>${gzKo(gzT)} · 오늘의 일진</small></div>${meta}</div>` +
    `<div><h2>${head}</h2>` +
      `<div class="layerlines">${lines}</div>` +
      (stackTxt ? `<div class="stackbox">${stackTxt}</div>` : "") +
      body +
      `<div class="act">오늘 할 것 하나 — <b>${act}</b></div>` +
      (stale ? `<div class="stale">${stale}</div>` : "") +
    `</div>`;
}

/* ══ 프로필 ═════════════════════════════════════ */
const DEFAULT_PROFILE = { name: "", date: "1995-10-29", time: "06:30", timeKnown: true, gender: "M", demo: false };
const STORE = "unsi-profile-v1";

function loadProfile() {
  try { const s = localStorage.getItem(STORE); if (s) return JSON.parse(s); } catch (e) {}
  return { ...DEFAULT_PROFILE };
}
function saveProfile(p) { try { localStorage.setItem(STORE, JSON.stringify(p)); } catch (e) {} }

function boot(profile) {
  NATAL = buildNatal(profile);
  PERIODS = computePeriods(NATAL);
  render();
  const f = document.getElementById("birthForm");
  f.bname.value = profile.name || "";
  f.bdate.value = profile.date;
  f.btime.value = profile.time || "12:00";
  f.bunknown.value = profile.timeKnown ? "known" : "unknown";
  f.bgender.value = profile.gender;
}

document.getElementById("birthForm").addEventListener("submit", e => {
  e.preventDefault();
  const f = e.target;
  if (!f.bdate.value) return;
  const p = { name: f.bname.value.trim(), date: f.bdate.value, time: f.btime.value || "12:00",
              timeKnown: f.bunknown.value === "known" && !!f.btime.value, gender: f.bgender.value, demo: false };
  saveProfile(p); boot(p);
  document.getElementById("settings").open = false;
  window.scrollTo({ top: 0, behavior: "smooth" });
});
document.getElementById("resetBtn").addEventListener("click", () => {
  try { localStorage.removeItem(STORE); } catch (e) {}
  boot({ ...DEFAULT_PROFILE });
});

boot(loadProfile());
</script>
